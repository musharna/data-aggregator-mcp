<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 590" width="820" height="590" role="img" aria-labelledby="t d">
  <title id="t">How one search runs</title>
  <desc id="d">A search for transcriptome data on Orobanche aegyptiaca. NCBI Taxonomy maps the organism to its current name, Phelipanche aegyptiaca; the 11 sources that accept synonyms search both names, and the other 6 get the plain query. The query goes to 17 sources in parallel: 10 archives, 6 omics sources and 1 literature source. Records that share a DOI collapse to one, keeping the copy that can be downloaded. A record can then be resolved to its files and checksums, fetched with the checksum verified where the source publishes one, or queried with SQL without downloading it.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; font-size: 16px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
      .step { font-size: 15px; fill: #57606a; font-weight: 600; }
      .head { font-size: 17px; font-weight: 600; }
      .note { font-size: 15px; fill: #424a53; }
      .str { fill: #0a3069; }
      .hit { fill: #953800; font-style: italic; }
      .box { fill: #f6f8fa; stroke: #d0d7de; }
      .hub { fill: #ddf4ff; stroke: #54aeff; }
      .wire { stroke: #57606a; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="819" height="589" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <!-- 1 ask -->
  <text class="step" x="20" y="51">1 · ask</text>
  <rect class="box" x="120" y="20" width="680" height="48" rx="8"/>
  <text class="mono" x="136" y="49">search(<tspan class="str">"transcriptome"</tspan>, organism=<tspan class="str">"Orobanche aegyptiaca"</tspan>)</text>

  <!-- 2 expand -->
  <text class="step" x="20" y="125">2 · expand</text>
  <rect class="box" x="120" y="90" width="680" height="72" rx="8"/>
  <text x="136" y="119"><tspan class="head">NCBI Taxonomy:</tspan> Orobanche aegyptiaca → <tspan class="hit">Phelipanche aegyptiaca</tspan> (current)</text>
  <text class="note" x="136" y="146">11 sources search both names; the other 6 get the plain query and say so.</text>

  <!-- 3 fan out -->
  <text class="step" x="20" y="219">3 · fan out</text>
  <rect class="hub" x="120" y="184" width="680" height="190" rx="8"/>
  <text class="head" x="136" y="212">17 sources, queried in parallel</text>
  <text class="note" x="136" y="244">archives · 10</text>
  <text x="136" y="268">Zenodo · DataCite</text>
  <text x="136" y="290">DataONE · Hugging Face</text>
  <text x="136" y="312">OpenML · RCSB PDB</text>
  <text x="136" y="334">UniProtKB · GBIF</text>
  <text x="136" y="356">data.gov · NASA CMR</text>
  <text class="note" x="366" y="244">omics · 6</text>
  <text x="366" y="268">NCBI GEO / SRA / BioProject</text>
  <text x="366" y="290">BioStudies · OmicsDI</text>
  <text x="366" y="312">DANDI · CZ CELLxGENE</text>
  <text x="366" y="334">GWAS Catalog</text>
  <text class="note" x="616" y="244">literature · 1</text>
  <text x="616" y="268">PubMed and</text>
  <text x="616" y="290">OpenAIRE</text>

  <!-- 4 merge -->
  <text class="step" x="20" y="431">4 · merge</text>
  <rect class="box" x="120" y="396" width="680" height="62" rx="8"/>
  <text x="136" y="424"><tspan class="head">dedupe by DOI:</tspan> records that share a DOI become one</text>
  <text class="note" x="136" y="447">The copy you can download wins. Records without a DOI are all kept.</text>

  <!-- 5 use -->
  <text class="step" x="20" y="515">5 · use a hit</text>
  <rect class="box" x="120" y="480" width="216" height="90" rx="8"/>
  <text class="mono" x="136" y="506" font-weight="600">resolve</text>
  <text class="note" x="136" y="530">files, sizes and</text>
  <text class="note" x="136" y="551">checksums</text>
  <rect class="box" x="352" y="480" width="216" height="90" rx="8"/>
  <text class="mono" x="368" y="506" font-weight="600">fetch</text>
  <text class="note" x="368" y="530">checksum verified where</text>
  <text class="note" x="368" y="551">the source publishes one</text>
  <rect class="box" x="584" y="480" width="216" height="90" rx="8"/>
  <text class="mono" x="600" y="506" font-weight="600">operate</text>
  <text class="note" x="600" y="530">SQL on a remote CSV or</text>
  <text class="note" x="600" y="551">Parquet, no download</text>

  <!-- wires -->
  <path class="wire" d="M460 68 V86" marker-end="url(#arrow)"/>
  <path class="wire" d="M460 162 V180" marker-end="url(#arrow)"/>
  <path class="wire" d="M460 374 V392" marker-end="url(#arrow)"/>
  <path class="wire" d="M460 458 V468 H228 V476" marker-end="url(#arrow)"/>
  <path class="wire" d="M460 458 V476" marker-end="url(#arrow)"/>
  <path class="wire" d="M460 468 H692 V476" marker-end="url(#arrow)"/>
</svg>
