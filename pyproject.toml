[project]
name = "data-aggregator-mcp"
version = "0.45.3"
description = "Research-data acquisition MCP — find and fetch datasets across archives, omics registries, and literature"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jaret Arnold", email = "mjarnold1998@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = [
    "mcp",
    "model-context-protocol",
    "datasets",
    "zenodo",
    "datacite",
    "ncbi",
    "sra",
    "geo",
    "bioinformatics",
    "research-data",
]
dependencies = [
    # Floor is a security floor, not a feature floor: <1.28.1 carries
    # GHSA-vj7q-gjh5-988w (WebSocket transport skips Host/Origin validation),
    # GHSA-jpw9-pfvf-9f58 (HTTP transports serve session requests without
    # verifying the authenticated principal), and GHSA-hvrp-rf83-w775 (task
    # handlers leak across clients). The first two are directly reachable from
    # the HTTP transport this package now ships.
    #
    # The ceiling is <2 because this server is built on the 1.x low-level API:
    # `Server` plus the `@server.list_tools()` / `@server.call_tool()` decorator
    # registration. mcp 2.x removed those decorators - handlers are passed to
    # the constructor now - so `data_aggregator_mcp.server` raises
    # `AttributeError: 'Server' object has no attribute 'list_tools'` on IMPORT
    # under 2.x. It is not a deprecation to work through later; the module does
    # not load. #69 widened this to <3 mechanically and nothing caught it,
    # because CI installs from uv.lock (mcp 1.28.1) and never resolves the
    # declared range. The `declared-deps` CI job now does.
    #
    # Raise this to <3 in the commit that migrates to the 2.x server API, not
    # before.
    "mcp>=1.28.1,<3",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "pytest-cov>=5.0",
    "ruff>=0.3",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "mypy>=2.1.0",
]
operate = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "fsspec>=2024.6",
    "aiohttp>=3.9",
]

[project.scripts]
data-aggregator-mcp = "data_aggregator_mcp.server:main"

[project.urls]
Homepage = "https://github.com/musharna/data-aggregator-mcp"
Repository = "https://github.com/musharna/data-aggregator-mcp"
Issues = "https://github.com/musharna/data-aggregator-mcp/issues"
Changelog = "https://github.com/musharna/data-aggregator-mcp/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_aggregator_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F (default) plus import-sorting, bugbear, pyupgrade, and simplify.
# E501 (line-too-long) is intentionally left to the formatter — `ruff format`
# wraps code; E501 would otherwise only nag about long strings/comments/URLs.
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mutmut]
source_paths = ["src"]
