name: nightly-live

# The live-gated tests (DATA_AGGREGATOR_MCP_LIVE=1) drive the real upstream APIs.
# Required CI never sets that variable, so for weeks two kinds of break were
# invisible: data.gov retired its CKAN API (every search 404ed) and a live test
# still called a handler with its mcp 1.x signature (TypeError). This job runs
# them every night and keeps ONE tracking issue open while they are red, so an
# upstream change surfaces within a day instead of at the next manual audit.
#
# It asks some 25 hosts, so most nights one of them is down: from 2026-10-12 every
# run was red with outages alone, and a real break would have been lost among them.
# A live test failed by a host that did not answer is now reported skipped
# (tests/_upstream_down.py), and scripts/live_verdict.py turns the run red only when
# a test's host has been down 3 runs in a row, so a host gone for good still shows.

on:
  schedule:
    - cron: "43 8 * * *" # 08:43 UTC = 04:43 EDT, daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read # the previous run's down streaks

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --extra dev --extra operate
      - name: Live suite
        id: live
        env:
          DATA_AGGREGATOR_MCP_LIVE: "1"
          DATA_AGGREGATOR_MCP_DOWN_FILE: down.json
        # continue-on-error so the issue step below runs and records the failure;
        # the verdict step re-raises it so the job itself still goes red.
        continue-on-error: true
        run: |
          set -o pipefail
          uv run pytest -q -p no:cacheprovider -rfs 2>&1 | tee live.log
      - name: Previous run's down streaks
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          id=$(gh run list --workflow nightly-live.yml --branch "$BRANCH" --status completed \
            --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$id" ]; then
            echo "::notice::no earlier run on $BRANCH; counting down streaks from this one"
            exit 0
          fi
          if out=$(gh run download "$id" -n live-down-streaks -D previous 2>&1); then
            echo "path=previous/streaks.json" >> "$GITHUB_OUTPUT"
          elif grep -q 'no valid artifacts found' <<<"$out"; then
            echo "::notice::run $id kept no down streaks; counting from this one"
          else
            echo "$out"
            exit 1
          fi
      - name: Down streaks
        id: streaks
        continue-on-error: true
        env:
          PREVIOUS: ${{ steps.previous.outputs.path }}
        run: |
          set -o pipefail
          uv run --no-sync python scripts/live_verdict.py down.json streaks.json \
            ${PREVIOUS:+--previous "$PREVIOUS"} | tee streaks.md
          cat streaks.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-down-streaks
          path: streaks.json
          retention-days: 30
          if-no-files-found: error
      - name: Upsert or close the tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE: ${{ steps.live.outcome }}
          STREAKS: ${{ steps.streaks.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create live-upstream --color B60205 --force >/dev/null
          num=$(gh issue list --label live-upstream --state open --json number -q '.[0].number')
          if [ "$LIVE" = "success" ] && [ "$STREAKS" = "success" ]; then
            if [ -n "$num" ]; then gh issue close "$num" --comment "Live suite green again: $RUN_URL"; fi
            exit 0
          fi
          summary=$(grep -E '^(FAILED|ERROR) ' live.log | head -40 || true)
          tail_line=$(tail -1 live.log)
          streaks=$(cat streaks.md 2>/dev/null || echo "(no down streaks: the streak step did not run)")
          # shellcheck disable=SC2016  # the backticks are a literal Markdown code fence
          body=$(printf 'The nightly live suite is red.\n\nRun: %s\n\n```\n%s\n%s\n```\n\n%s\n\nA failed test got an answer it did not expect: an upstream API change (fix the adapter) or a stale test. A host that did not answer is a skip, listed above with how many runs in a row; at 3 the run is red, so check whether that host has moved or gone.' "$RUN_URL" "$summary" "$tail_line" "$streaks")
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
          else
            gh issue create --label live-upstream --title "Nightly live suite failing" --body "$body"
          fi
      - name: Verdict
        if: always()
        env:
          LIVE: ${{ steps.live.outcome }}
          STREAKS: ${{ steps.streaks.outcome }}
        run: |
          if [ "$LIVE" != "success" ]; then echo "::error::live tests failed; see the live-upstream issue"; fi
          if [ "$STREAKS" != "success" ]; then echo "::error::a host has been down 3 runs in a row, or the streaks could not be counted"; fi
          [ "$LIVE" = "success" ] && [ "$STREAKS" = "success" ]
