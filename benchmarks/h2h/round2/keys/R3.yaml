task: R3
criteria: >-
  Included: a public deposit of transcriptomic data (RNA-seq, EST libraries, microarray) or proteomic data
  (MS) generated from tardigrade tissue (any species) where the design compares hydrated/active animals with
  desiccating, dehydrated, tun (anhydrobiotic) or rehydrating animals, or otherwise directly targets desiccation
  tolerance in tardigrade material (e.g. dehydration-time-course or preconditioning transcriptomes, proteomics
  of tardigrade lysate under dehydration-like stress). A deposit qualifies even if desiccation is one arm of a
  larger design (e.g. developmental series plus active/tun), but at least one desiccated/tun/rehydrating sample
  must be in it. Aliases of one deposit (GEO series, BioProject, SRA/DRA study and submission, ENA mirror, umbrella
  project, figshare/Zenodo copy or derived files from the same study) are grouped as one study.
  Excluded: genome or transcriptome assemblies alone; single-state transcriptomes; radiation-, UV-, bleomycin-,
  heat-, freezing-only and osmotic-stress/osmobiosis-only studies (osmobiosis tuns are treated as not desiccation);
  tardigrade proteins expressed in human cells, yeast, bacteria or cyanobacteria; amplicon/microbiome data;
  reanalyses with no new deposit; papers whose data are not publicly deposited (on request or supplement-only);
  deposits that do not resolve publicly.
studies:
  - key: S1
    title: RNA Sequencing to improve annotation and detect expression changes during anhydrobiosis (Ramazzottius varieornatus; Hashimoto et al. 2016 Nat Commun)
    year: 2016
    ids: [PRJDB2359, DRP001175, DRA001120, DRR013911, DRR013912, DRR013913, DRR013914, DRR013915, DRR013916, PRJDB2360, PRJDB5011]
    archives: [DDBJ DRA, SRA, ENA]
    evidence: Runs are hydrated, dehydrated, rehydrated-80min and rehydrated-3h adults of R. varieornatus YOKOZUNA-1, plus 2 embryo runs. PRJDB5011 is the umbrella project, which also holds the genome. PRJDB2360 is where DRX012461/2 were reassigned from.
  - key: S2
    title: RNA-Seq analysis of developmental, juvenile, and anhydrobiotic stages of Hypsibius dujardini and Ramazzottius varieornatus (Yoshida et al. 2017 PLoS Biol)
    year: 2017
    ids: [GSE94295, PRJNA369262, SRP098585, SRA533808]
    archives: [GEO, SRA, ENA]
    evidence: 78 samples; includes H_active/H_tun (10k and 30 animals) and the matching R. varieornatus active/tun samples, n=3 each.
  - key: S3
    title: Hypsibius dujardini, Paramacrobiotus richtersi, Milnesium tardigradum raw reads (Boothby et al. 2017 Mol Cell, CAHS)
    year: 2017
    ids: [PRJNA369152, SRP098563]
    archives: [SRA, ENA]
    evidence: RNA-seq of hydrated vs desiccated H. dujardini and P. richtersi (plus frozen H. dujardini). 14 runs, SRR5217467 to SRR5367888.
  - key: S4
    title: Comparative transcriptomics in an anhydrobiotic tardigrade, Hypsibius dujardini, during desiccation treatment
    year: 2019
    ids: [PRJDB5599, DRP004847, DRR089007, DRR089008, DRR089009, DRR089010, DRR089011]
    archives: [DDBJ DRA, SRA, ENA]
    evidence: Active vs early- and late-phase desiccation (DMSO 6 h/24 h) vs cycloheximide-pretreated (CYH 6 h/24 h) H. dujardini Z151. It targets de novo gene expression needed for anhydrobiosis.
  - key: S5
    title: Genome and transcriptome sequencing from a single animal of Hypsibius dujardini (Arakawa et al. 2016 Sci Data)
    year: 2016
    ids: [PRJDB4575, DRP003101]
    archives: [DDBJ DRA, SRA, ENA]
    evidence: "BORDERLINE: a genome-focused deposit, but its RNA-seq includes adult active state (SAMD00047029) and adult tun state (SAMD00047030) alongside egg/juvenile stages."
  - key: S6
    title: Genome and transcriptome analyses of a trehalose-producing dioecious tardigrade, Paramacrobiotus sp. TYO (Hara et al. 2021 Open Biol)
    year: 2021
    ids: [PRJDB7223, DRP007399, 10.6084/m9.figshare.14489778, 10.6084/m9.figshare.c.5491291]
    archives: [DDBJ DRA, SRA, ENA, figshare]
    evidence: P. metropolitanus (sp. TYO) RNA-seq of hydrated adults vs adults dehydrated for 3 h, 1 d and 2 d (SAMD00132251-60). The figshare items hold the paper's slow-dehydration DE-gene table and supplement.
  - key: S7
    title: Towards decrypting cryptobiosis - analyzing anhydrobiosis in Milnesium tardigradum using transcriptome sequencing (Wang et al. 2014 PLoS One)
    year: 2014
    ids: [PRJNA79663, SRP002584, SRA020123, SRX426237, SRX426238, SRX426239, SRX426240, SRR1046127, SRR1046358, SRR1046360, SRR1046361, SRR057381]
    archives: [SRA, ENA]
    evidence: Illumina runs of active, inactive tun, dehydration and rehydration states, plus a 454 Funcrypta reference run in the same SRA study.
  - key: S8
    title: Transcriptome survey of the anhydrobiotic tardigrade Milnesium tardigradum, EST libraries (Mali et al. 2010 BMC Genomics)
    year: 2010
    ids: [LIBEST_023933, LIBEST_023934, SAMN00166894, SAMN00166895, PRJNA34121, SRP296161, SRR9493355]
    archives: [GenBank dbEST, BioSample, SRA]
    evidence: "dbEST libraries Milnesium_active (1,382 ESTs) and Milnesium_inactive (6,255 ESTs), with GO enrichment active vs inactive. PRJNA34121/SRR9493355 (Funcrypta Wuerzburg capillary EST traces from THW Wildau) is a PROBABLE alias: same project and centre, but the link is not stated explicitly."
  - key: S9
    title: Gene expression in Echiniscus testudo
    year: 2019
    ids: [PRJNA510287, SRP173948]
    archives: [SRA, ENA]
    evidence: 21 single-individual RNA-seq samples of the heterotardigrade E. testudo labelled Active_repN, Pre-tun_repN and Desiccated_repN (SAMN10601501-21). No linked paper was identified.
  - key: S10
    title: Multiomics study of a heterotardigrade, Echiniscus testudo (Murai et al. 2021 BMC Genomics)
    year: 2021
    ids: [PRJNA669587, SRP287522, SRR12832600, SRR12832599, 10.6084/m9.figshare.13060634]
    archives: [SRA, ENA, figshare]
    evidence: E. testudo active vs tun RNA-seq (plus a genome run). The figshare copy holds the assembly and CDS of the same study.
  - key: S11
    title: Dehydration-dependent reversibly condensing proteins (Tanaka et al. 2022 PLoS Biol)
    year: 2022
    ids: [PXD030241, JPST001416]
    archives: [jPOST, ProteomeXchange]
    evidence: "BORDERLINE: shotgun proteomics of R. varieornatus lysate condensed under the dehydration-like desolvating agent TFE (T-DRYPs). Tardigrade tissue was profiled to target desiccation-tolerance proteins, but there is no hydrated-vs-desiccated animal contrast."
