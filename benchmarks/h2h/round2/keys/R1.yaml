  - "esearch sra txid99112[Organism:exp] -> 116; '\"Phelipanche aegyptiaca\"' -> 116; '\"Orobanche aegyptiaca\"' -> 152 (36 extra = soil metagenome PRJNA1182506/1182524)"
  - "esearch bioproject txid99112[Organism:exp] -> 16; '\"Phelipanche aegyptiaca\"' -> 13; '\"Orobanche aegyptiaca\"' -> 5"
  - "esearch bioproject '(Orobanche OR Phelipanche OR broomrape OR broomrapes) NOT txid99112[Organism:exp]' -> 76 (only 3 mention aegyptiaca; none add P. aegyptiaca data)"
  - "esearch gds txid99112[Organism:exp] -> 4 (GSE181578, GSE181576, GSMs, GPL30484); gds '(Orobanche OR Phelipanche OR broomrape) AND gse[ETYP]' -> 5"
  - "esearch assembly txid99112 / both names -> 0"
  - "esearch biosample txid99112 -> 132; '\"Orobanche aegyptiaca\"' -> 169 (extras: 36 soil, 1 Lotus)"
