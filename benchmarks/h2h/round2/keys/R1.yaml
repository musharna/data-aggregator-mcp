  - "Europe PMC '(TITLE:aegyptiaca OR ABSTRACT:...) AND OPEN_ACCESS:Y AND HAS_FT:Y' -> 138 full texts regex-scanned for accessions (added PRJCA050165 [unreleased], confirmed paper links for S5-S12)"
