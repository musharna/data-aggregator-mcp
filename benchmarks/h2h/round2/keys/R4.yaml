task: R4
criteria: >-
  Included: any public data deposit (verified to resolve, built 2026-10-05) whose main subject is wild Panthera uncia.
  That means field data (camera trap, GPS telemetry, occupancy or sign surveys, compiled field occurrence records,
  scat or tissue genetics and metabarcoding, pathogen or virome sequencing of wild animals) or prey or conflict surveys
  explicitly centred on snow leopards. A study counts if snow leopard is the sole focal species, or a named co-focal
  species in the title with its own data (snow leopard + lynx, + wolf, + its prey, with the analysis turning on snow leopard).
  Range-wide connectivity or priority-area models built for snow leopard are included.
  Unit = study = one research output. All of its deposits are aliases and grouped together:
  a Dryad DOI plus the Zenodo record that indexes it plus Dryad's software/supplement Zenodo DOI;
  figshare/Zenodo versions and duplicate uploads; BioProject plus SRA/DRA/GSA study plus companion data files of the same paper.
  Publisher-hosted supplementary files (Royal Society, Frontiers, BMC/Springer, PLOS, Pensoft figshare portals) are
  listed only as aliases of a study that qualifies on its own; supplements standing alone are near misses.
  Excluded: zoo or captive-only work; reference-genome assemblies with no field sampling; methods or simulation studies;
  multi-carnivore or multi-species datasets where snow leopard is one of several (not title-focal); GBIF datasets that merely
  contain snow leopard records (no GBIF dataset is snow-leopard-dominated: the highest share is 3/85 records);
  papers, reports, theses and registrations without data; GitHub-only data; BioProjects with no public runs;
  embargoed or unresolvable DOIs. Items marked BORDERLINE in evidence are prey-centred studies included because the title
  frames them around snow leopards.
