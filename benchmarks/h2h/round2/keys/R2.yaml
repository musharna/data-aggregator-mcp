queries:
  - "E-utils gds: \"Ambystoma mexicanum\"[Organism] AND gse[Entry Type] -> 80 series (all screened by summary/design/samples)"
  - "E-utils gds: (axolotl OR \"Ambystoma mexicanum\" OR salamander) AND (single-cell OR \"single cell\" OR scRNA-seq OR snRNA-seq OR \"single nucleus\" OR \"single-nucleus\" OR 10x OR Xenium OR Visium OR Stereo-seq OR spatial) AND gse[Entry Type] -> 43 (12 not in organism list; none axolotl limb sc)"
  - "E-utils bioproject: (axolotl OR \"Ambystoma mexicanum\"[Organism]) AND (single cell OR single-cell OR scRNA OR snRNA OR single nucleus OR spatial OR 10x) -> 42"
  - "E-utils sra: \"Ambystoma mexicanum\"[Organism] AND (\"transcriptomic single cell\"[Source] OR \"single cell\" OR \"single nucleus\" OR scRNA* OR 10x) -> 4566 runs / 30 projects"
  - "ENA portal: result=read_run&query=tax_eq(8296)&fields=study_accession,secondary_study_accession,study_title,library_source,library_strategy -> 5994 runs / 114 studies (all titles screened; generic-titled ones checked for run/sample titles)"
  - "Europe PMC: TITLE_ABS axolotl AND limb/digit/blastema AND single-cell terms, PUB_YEAR 2017-2026 -> 25"
  - "Europe PMC: (axolotl OR \"Ambystoma mexicanum\") AND (\"limb regeneration\" OR blastema) AND (scRNA-seq OR single-cell RNA OR snRNA-seq OR Xenium OR Stereo-seq OR 10x Genomics OR Smart-seq2), 2017-2026 -> 195 (primary papers' full-text data statements mined)"
