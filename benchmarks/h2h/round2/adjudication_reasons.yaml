# Blind adjudication of 29 pooled non-key entries, 2026-10-05. Evidence from archive APIs (NCBI E-utils, ENA portal/browser, GEO, PRIDE v2, ProteomeCentral, DataCite, DataONE solr, Figshare, Zenodo, Crossref).
- {task: R1, id: PRJNA872504, verdict: reject, reason: "NCBI: BioProject 'Normal transcriptome sequencing of P. aegyptiaca' (Shihezi, 2022-08-23); SRA esearch 0, ENA read_run 0; its only BioSample SAMN30468135 links to no SRA. Data-less sibling of S7."}
- {task: R1, id: PRJNA1083435, verdict: reject, reason: "NCBI: BioProject 'Transcriptome studies of P. aegyptiaca in different populations' (2024-03-04); SRA 0, ENA read_run 0, no BioSample links. Data-less sibling of S9."}
- {task: R2, id: GSE184948, verdict: reject, reason: "GEO (same_as PRJNA767085): 18 samples of FACS-sorted Hoxa13+ blastema cells, 300-cell Smart-seq2 pools, Tig1-transfected vs not; low-input bulk RNA-seq, not single-cell."}
- {task: R2, id: GSE243225, verdict: reject, reason: "GEO (same_as PRJNA1017433): 1 sample, 5 dpa lower arm processed with 10x Visium (SpaceRanger, spots); spot-based spatial, excluded by the prompt. Paper's scRNA is reanalysis."}
- {task: R3, id: PXD058865, verdict: "optional", reason: "PRIDE: H. exemplaris hydrated (HEPES) vs osmobiotic tun (600 mM sucrose / 75 mM NaCl) proteomics. Prompt counts 'hydrated vs tun' but the tun is osmotic, not anhydrobiotic; key YAML excluded osmobiosis. Borderline B1."}
- {task: R3, id: PXD069612, verdict: reject, reason: "PRIDE v2/v3 404; ProteomeCentral GetDataset code 1003 'reserved but not yet accessible'. Not public."}
- {task: R3, id: PRJNA263124, verdict: reject, reason: "ENA: 1 run (SRR1598869, 454 EST of M. tardigradum cDNA); project aims at phylogeny and anhydrobiosis gene features; single state, no hydrated/desiccated contrast."}
- {task: R3, id: 10.6084/m9.figshare.c.6019240, verdict: reject, reason: "DataCite/Figshare (incl. .v1): Springer Nature supplement to BMC Genomics 10.1186/s12864-022-08642-1; files are UVC heatmaps (zip) and UVC RNA-seq stats/gene tables. New data are UVC-only (GSE152753, a key near miss); anhydrobiosis comparison reuses S2."}
- {task: R3, id: PRJNA357357, verdict: reject, reason: "ENA: 1 run (SRR7309271), E. sigismundi RNA-seq of pooled individuals from a tidal habitat; single-state transcriptome, no desiccation contrast."}
- {task: R3, id: PRJEB59868, verdict: "optional", reason: "ENA (same_as ERP144913): R. varieornatus RNA-seq of osmobiotic tun (3 Osm/kg) vs freshwater controls. 'Tun' fits the prompt wording but the stress is osmotic, not desiccation; key YAML excluded. Borderline B2."}
- {task: R3, id: PRJDB1451, verdict: reject, reason: "ENA: only 3 WGS runs DRR013908-10 (DRA001119); child of umbrella PRJDB5011 like S1's PRJDB2359, but holds no expression data despite project text. Genome reads alone are excluded."}
- {task: R4, id: 10.3897/natureconservation.46.76036.suppl1, verdict: reject, reason: "Zenodo 6339849 (= this DOI): Pensoft supplement, one file oo_652290.pdf, description 'Questionnaire 1'. Blank survey form, no data."}
