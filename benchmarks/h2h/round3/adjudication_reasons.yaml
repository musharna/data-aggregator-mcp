- {"task": "T5", "id": "ngdc:PRJCA028562", "verdict": "add:A2", "reason": "NGDC BioProject PRJCA028562 (data type metabolomics, Hainan University, released 2024-07-26) holds one open-access OMIX dataset, OMIX006998, 'Metabolome Data by Mass Spectrometry (MS)': 54 samples (2.65 GB) of Acropora hyacinthus from Changjiang and Wuzhizhou, Hainan, heat-stressed in the lab up to 32 °C. It qualifies; my key missed it because I never searched NGDC/OMIX. Pooled from the #278 dam T5 rerun, 2026-10-11."}
