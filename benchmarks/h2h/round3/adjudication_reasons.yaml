- {"task": "T4", "id": "roboflow:bees-31jk6/bee-health-data-2.0-jgnjn-n6xrc", "verdict": "reject", "reason": "Roboflow fork (bees-31jk6, 109 images, classes healthy/infected/pollen carrier) whose description is copied from Erin Tomassoni's 'Bee Health Data 2.0', a St. Mary's College class assignment. It lists its images as drawn from PollenDataset (S1), VarroaDataset (S3), TFDS bee_dataset (S27) and BeeImage (S2). It is a small re-labelled composite of datasets already in the key, with no new images, so it is not a separate release and cannot alias to a single study."}
- {"task": "T4", "id": "roboflow:erin-tomassoni-workspace/final-bee-health-model-v3", "verdict": "reject", "reason": "Roboflow model project (130 images, instance segmentation, classes Bee/Mite/pollen). The description says it was a class assignment at St. Mary's College of Maryland, with images taken from iNaturalist research-grade photos and VarroaDataset (S3). It is a student re-labelling of scraped and already-keyed images, not an original dataset release. The same workspace's 'bee-health-data' is a key near miss."}
- {"task": "T4", "id": "doi:10.3390/s26082518", "verdict": "reject", "reason": "Crossref: Kulyukin et al. 2026 Sensors paper 'FAIRHiveFrames-1K'. The abstract describes 1,265 hive frame images annotated at cell level for comb analysis (7 categories). The labelled objects are comb cells, not bees. Its Zenodo record 10.5281/zenodo.19241078 is already a key near miss."}
- {"task": "T4", "id": "comvis-hust:pollenbee", "verdict": "reject", "reason": "VnPollenBee: re-checked 2026-10-12. The comvis-hust.github.io/datasets/pollenbee.html page's only data link is a Google Drive folder. Google-Drive-only data is excluded, and the same verdict was given on 2026-10-11 (key near miss)."}
- {"task": "T4", "id": "Labeled Dataset for Detecting Defensive Behavior of Honeybees at the Hive Entrance (Sledevic and Vdoviak; DOI not retrieved)", "verdict": "alias:S16", "reason": "The title and authors resolve to Zenodo 10.5281/zenodo.23077519 (concept 23077518), Sledevic and Vdoviak 2026. It has 87 entrance videos at 20 hives, labels.zip and images_part1-4.zip, CC BY 4.0. This is S16."}
- {"task": "T4", "id": "figshare:26999512", "verdict": "alias:S9", "reason": "Figshare API article 26999512, 'High Quality Honey Bee Dataset' (Borlinghaus), DOI 10.6084/m9.figshare.26999512.v1, 4 files. This is S9."}
- {"task": "T4", "id": "doi:10.3390/agriculture15151609", "verdict": "alias:S14", "reason": "Crossref: Sledevic 2025 Agriculture paper on single-shot detection of fanning behaviour. The abstract describes the same 18,000 annotated frames with 57,597 fanning instances as Zenodo 10.5281/zenodo.15622033 (S14). It is the paper describing S14's data (the MDPI page returned 403, so the data statement was not read)."}
- {"task": "T4", "id": "github:apic-ai/apic-bee-pose-dataset", "verdict": "add:A2", "reason": "GitHub repo by apic.ai GmbH, released with the DeepBees paper (Marstaller et al., ICCVW 2019). It holds data/pose with 229 bee images (191 train, 38 test) and pose_dataset.json (168 KB) with 32 keypoints per western honey bee (Apis mellifera), under a CC BY-NC-SA 4.0 LICENSE. It is a documented, licensed GitHub data release with keypoint annotations on bees, so it meets the inclusion rule. The key missed it."}
- {"task": "T4", "id": "roboflow:varroa-j8231/varroa4yolo", "verdict": "reject", "reason": "Roboflow project (workspace 'Varroa', 2,600 images, classes bee/varroa, CC BY 4.0). The page says 'A description for this project has not been published yet.' It is an undescribed personal Roboflow upload, the class the key excludes."}
- {"task": "T4", "id": "roboflow:erin-tomassoni-workspace/bee-health-data-2.0", "verdict": "reject", "reason": "The original of the 'Bee Health Data 2.0' forks (beeclassifier/...-jgnjn, bees-31jk6/...-n6xrc): 109 images, 3 classes, plus a trained model. The description calls it a class assignment and lists its sources as PollenDataset, VarroaDataset (Zenodo 4085044), TFDS bee_dataset and the Kaggle BeeImage set (S1, S3, S27, S2). It is a re-labelled composite of keyed datasets with no new data, and the workspace's v1 'bee-health-data' is a key near miss."}
- {"task": "T4", "id": "zenodo:21529070", "verdict": "reject", "reason": "Zenodo 21529070 (concept 17279440), Galopin et al. 'Impact of honey bee waggle dance recording framerate...'. Videos.zip plus small Ground_truth.zip and Training.zip, made to test framerate. It is already a key near miss (a methods record, not a labelled training set)."}
- {"task": "T4", "id": "roboflow:beedataset/honey-bee-detection-model-zgjnb-dmdag", "verdict": "optional:B2", "reason": "This is a fork of matt-nudi/honey-bee-detection-model-zgjnb (909 images, classes bee/pollenbee/drone/queen, CC BY 4.0); both pages carry the same description. Matt Nudi documents the purpose (counting bees with and without pollen at his backyard hive entrance) and gives labelling guidelines with examples, and github.com/mattnudi/bee-detection holds YOLOv5 weights trained on it. Borderline rather than add: it is a personal upload with no paper, and the drone and queen images come from 'additional training data not specific to my hive' with no stated source. Promote to add if the coordinator treats a documented labelling protocol as enough, as S26 was treated."}
- {"task": "T4", "id": "10.5281/zenodo.14929559", "verdict": "add:A1", "reason": "Zenodo concept 14929559 (version 14929560), Sledevic and Vdoviak 2025, CC BY 4.0, dataset.zip of 11.9 GB. It has 11,008 annotated hive-entrance frames from 15 hives: 116,853 bee, 14,062 pollen, 1,320 drone and 1,405 wasp instances, with two label sets (bee/pollen-bee/drone/wasp and bee/pollen/drone/wasp). The record says it extends Mendeley 8gb9r2yhfc (S13: 7,200 frames from 8 hives, a single bee class) with new hives and new classes. That is substantially new data from the same group, as with the group's separate S14-S16 releases, so it is a separate study the key missed."}
- {"task": "T4", "id": "zenodo.15622033", "verdict": "alias:S14", "reason": "Zenodo 15622033 (concept 15622032), Sledevic, 'Labeled Dataset for Detecting Fanning Behavior of Honeybees at the Hive Entrance': dataset-rgb.zip (17.3 GB), 18,000 frames, 57,597 fanning instances. This is S14."}
- {"task": "T4", "id": "mendeley.8gb9r2yhfc", "verdict": "alias:S13", "reason": "Mendeley public API: 10.17632/8gb9r2yhfc.6, Sledevic, 'Labeled dataset for bee detection and direction estimation on beehive landing boards'. It has 7,200 detection frames with YOLO boxes plus segmentation, pose, tracking and behaviour sets. Its same_as PMC10831503 is the Data in Brief paper 10.1016/j.dib.2024.110060, already aliased to S13. This is S13."}
- {"task": "T4", "id": "mendeley.5yz78xxpmy", "verdict": "alias:S10", "reason": "Mendeley public API: 10.17632/5yz78xxpmy.1, 'BEEHIVE: a public dataset of Apis mellifera images to empower honeybee monitoring research' (Frame and Bottom camera images). This is S10."}
- {"task": "T4", "id": "zenodo.23099412", "verdict": "alias:S6", "reason": "Zenodo 23099412 (concept 23099411), Su, Gao, Lee and Wu 2026: dataset_2823_images_labels.zip (2,823 in-hive frames, YOLO boxes on bees with or without a visible mite), splits, code and weights; isNewVersionOf 20488016. This is S6."}
- {"task": "T4", "id": "10.5281/zenodo.15682344", "verdict": "reject", "reason": "Zenodo 15682344, Blaha et al. 2025 '[Dataset] On the Movement of the Honeybee Queen in the Hive'. It holds queen_september_2022_clean.zip of per-hour detections_hive_X_with_pred.csv files plus a supplementary PDF: detection tables with no annotated images. It is already a key near miss."}
- {"task": "T4", "id": "oist:honeybee_tracking_datasets", "verdict": "alias:S7", "reason": "The OIST page 'Honeybee Segmentation and Tracking Datasets' (oist.jp/node/43475, read via headless Chromium). Its 'Honeybee detection' section hosts frames and position/angle annotations for the 30 and 70 fps recordings (360 annotated frames each, Bozek 2018, arXiv 1712.08324), which is the data mirrored as S7. Its 'tracking I/II' sections are detection and trajectory files (key near-miss class). The beepositions.unit.oist.jp download host failed TLS on 2026-10-12. This matches the 2026-10-11 verdict aliasing this page to S7."}
- {"task": "T4", "id": "github:BeeAlarmed/BeeDataset", "verdict": "alias:S27", "reason": "GitHub BeeAlarmed/BeeDataset (GPL-3.0), 'Tensorflow dataset containing images of bees for multilabel classification'. This is S27, already in the key."}
- {"task": "T4", "id": "zenodo.4400651", "verdict": "alias:S17", "reason": "Zenodo 4400651 is the version record of concept 4400650, 'BEE4EXP' (Stojnic, Risojevic, Mustra, Jovanovic 2020). It has 3 test videos with .npy ground-truth honeybee detections and 3 background videos. This is S17."}
- {"task": "T5", "id": "PMC13259630 (OSF)", "verdict": "alias:S28", "reason": "The data statement of PMC13259630 (Montalbetti et al. 2026 iScience, 10.1016/j.isci.2026.116207) points to osf.io/t4xd9 through a view-only link. The OSF API (view-only key) shows public:false with files Metabolomics_Raw Data.zip, Metadata_metabolomics.xlsx and Metabolomics_analysis.csv; S. pistillata and P. damicornis at 25 vs 31 °C. This is exactly key S28 (borderline)."}
- {"task": "T5", "id": "MSV000096718", "verdict": "reject", "reason": "No public data. MassIVE dataset.jsp redirects to private-dataset.jsp ('Datasets remain private in MassIVE until explicitly released'), the info servlet returns 'Unauthorized access', and the GNPS2 file cache has no files; positive control MSV000096582 resolves publicly with files. No Europe PMC paper cites it. The key excludes private ids."}
