- {"task": "T5", "id": "10.5281/zenodo.17116571", "verdict": "add:A1", "reason": "Zenodo data paper record (concept 17116571, version 17116572; open access) has metabolomics_data.csv plus t0/t1_metabolites.csv, quantified metabolites (DMSP, betaine, trigonelline and others) for 50 samples. Sample metadata codes them Acro_* (T0/T1, 5 probiotic/postbiotic/placebo treatments). Per the preprint (10.1101/2025.10.09.679041) and Cell Rep 2026 (10.1016/j.celrep.2026.117839) abstracts, these are bleaching Acropora cf. valida sampled in situ in the Red Sea during a marine heatwave, profiled by untargeted metabolomics. This meets the heatwave/bleaching criterion; my key missed it."}
- {"task": "T5", "id": "10.5066/p13iqrxz", "verdict": "optional:B1", "reason": "USGS ScienceBase, Drury 2026: M. capitata/P. compressa reciprocal transplant. Biochemistry_Data.csv is an LC-MS feature table, 177 samples x ~10k features. Cross-referencing Coral_Sample_Data.csv shows that 70 of the 176 matched metabolomics samples are 'stress_1' fragments used in a heat-stress assay (StressTest1, eDHW ramp). However, the FGDC metadata calls the metabolite data 'post outplanting', and those rows carry only collection dates, so I could not confirm whether tissue was taken before or after heating. The key listed this as a near miss; it is upgraded to borderline because heat-assay fragments are in the metabolomics set."}
- {"task": "T5", "id": "10.5281/zenodo.15681195", "verdict": "reject", "reason": "Matthews et al. 2025 Commun Biol (PMC12550023): the lipidomics table (Lipid indv data, NegativeRaw/PositiveRaw.xlsx) has only feeding treatments (Unfed, Calanus Oil, Fish Oil, LNP, Phospholipids, Sterol, TG; 4 replicates each) of Acropora larvae sampled at T2 after feeding. The 28 vs 31 °C exposure was applied later to settled recruits, and only survival was recorded. No heat-treated metabolomics samples. 'Metabolomics Workbench study 6054' is not a public ST id (ST006054 returns empty), so it can't be checked."}
