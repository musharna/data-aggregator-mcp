task: T5
prompt: >-
  Find every public dataset, in any archive, that holds metabolomics data (untargeted or targeted LC-MS, GC-MS or NMR,
  raw files or processed metabolite/feature tables; lipidomics-only counts) from reef-building stony corals
  (Scleractinia: whole holobiont, or host or Symbiodiniaceae fractions taken from corals) where at least one sampled
  condition is thermal stress (experimental heating or a marine heatwave) or bleaching. Proteomics-only and
  transcriptomics-only data, sea anemones (Aiptasia/Exaiptasia), soft corals, jellyfish, Symbiodiniaceae grown only in
  culture, and papers without deposited data do not count.
criteria: >-
  Topic: PRIMARY (coral thermal-stress / bleaching metabolomics); the backup topic was not needed. Included: a public
  deposit in an archive (MetaboLights, Metabolomics Workbench, MassIVE/GNPS, MetaboBank, Zenodo, Figshare, Dryad, OSF,
  BCO-DMO, PANGAEA, institutional repositories) of mass-spectrometry or NMR metabolomics or lipidomics data (raw files,
  peak/feature tables or quantified metabolite tables; volatilome GC-MS counts) from scleractinian corals or from host
  or symbiont fractions isolated from scleractinian corals, where at least one sampled group is heat-treated (any
  elevated-temperature exposure, including acute CBASS-style ramps), sampled during or after a natural marine heatwave,
  or visibly bleached. Species and condition were confirmed from the deposit's own metadata, sample sheet or file names,
  or, if silent, from the linked paper's methods (Europe PMC full text). Flagged confidence: borderline (kept in the
  key, can be scored separately or dropped): deposits with no sample sheet where the heat/bleaching subset could not be
  confirmed; a non-heat primary design (bleaching-history parents, Vibrio co-culture at two temperatures, coral
  exudate DOM rather than tissue); data shipped inside a software/R package; journal-supplement tables on a publisher
  Figshare portal (no raw data); a private OSF project reachable only via the view-only link printed in the paper.
  Excluded: proteomics-only and transcriptomics-only deposits (including MassIVE proteomics deposits whose titles look
  like metabolomics); Exaiptasia/Aiptasia, soft corals (Sarcophyton, Clavularia-only), giant clams, fish; Symbiodiniaceae
  or bacteria grown only in culture; coral metabolomics with no heat/bleaching group (genotype, disease, light, cold,
  nutrients, predation, ocean acidification alone); bulk lipid content, fatty-acid or isotope physiology tables that are
  not metabolite profiles; supplements that are PDFs only; embargoed or private ids; papers with no deposit. Unit = study:
  a MassIVE MSV and its 10.25345 DOI and GNPS task, a Metabolomics Workbench ST and its PR and 10.21228 DOI, a Figshare
  item and its versions, a Zenodo concept and version DOIs, and an OSF project with the GitHub/Zenodo release of the same
  paper's data are aliases of one study. Sibling deposits from one paper in one archive that split one experiment
  (untargeted + targeted BCO-DMO tables; a re-uploaded Figshare item) are grouped. Separate MassIVE deposits stay
  separate studies even when one paper cites both (S5/S6). A workshop demo subset of another MSV is listed as its alias.
