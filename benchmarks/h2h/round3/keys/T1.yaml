task: T1
prompt: >-
  Find every public dataset, in any archive, that holds extracellular electrophysiology (single units, LFP,
  tetrodes, silicon probes, Neuropixels) or calcium/voltage imaging recorded from the mouse olfactory bulb in living
  animals (awake or anesthetized) while odors were presented. Raw or processed neural data both count. Slice or other
  in-vitro-only recordings, other species, other brain regions without olfactory-bulb recordings, behavior-only data,
  code-only repositories, and papers without deposited data do not count.
criteria: >-
  Topic: PRIMARY (in vivo odor-evoked recordings from the mouse olfactory bulb). Included: a public deposit in an archive
  (DANDI, CRCNS, Zenodo, Figshare, Dryad, Mendeley Data, GigaDB, NYU UltraViolet, SSBD, etc.) holding extracellular
  electrophysiology (units, LFP) or calcium/voltage imaging (GCaMP widefield or two-photon) recorded in vivo from the
  olfactory bulb of Mus musculus while odorants (monomolecular odors, mixtures, plumes, conspecific/neutral chemical
  stimuli) were delivered. Imaging of any element inside the OB counts: OSN axon terminals in glomeruli, mitral/tufted,
  external tufted, periglomerular, dopaminergic and granule cells. Imaging of cortical feedback axons inside the OB is
  kept but flagged confidence: borderline (it records in the OB, but not OB neurons). Processed data count, including
  per-figure source-data tables of odor-evoked dF/F or spike data. Deposits whose OB neural data could not be confirmed
  in the file listing, and single-example-image deposits, are flagged borderline. Species, region and odor condition were
  confirmed from the deposit text or, if silent, from the linked paper's methods (Europe PMC full text or preprint
  abstract). Excluded: slice / ex vivo / semi-intact recordings; rat, human, Drosophila, locust, zebrafish, trout;
  piriform, AON, tubercle, hippocampus or other regions without OB recordings; OB recordings with no odor presentation
  (sleep, spontaneous, nasal airflow, optogenetic 'synthetic odors' only); intrinsic-optical-signal and synaptopHluorin
  imaging (neither ephys nor calcium/voltage); behavior-only and code-only deposits; journal supplement PDFs; DOIs that do
  not resolve. Unit = study: copies, versions, Dryad-to-Zenodo mirrors, concept/version DOIs, and multiple DOIs or parts of
  the same dataset are aliases of one study. Qualifying deposits from the same paper are grouped as one study; sibling
  deposits from the same paper that hold only behavior, histology or code are not listed as aliases (they are near misses
  where examined).
