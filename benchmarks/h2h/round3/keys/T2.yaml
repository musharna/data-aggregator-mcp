size_verdict: "ok: 25 studies (22 firm + 3 borderline) across GEO/SRA, GSA-Human, CELLxGENE, HCA, ArrayExpress/ENA, Zenodo and dbGaP. Within 5-30 and at least 3 archives, so the backup topic was not used."
