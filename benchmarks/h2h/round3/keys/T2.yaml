    evidence: "confidence: borderline. 4 10x scRNA-seq samples of human uterosacral ligament (3 POP, 1 control; PMID 38326542). It is a named ligament, but a pelvic visceral fibromuscular one rather than a musculoskeletal ligament."
near_misses:
