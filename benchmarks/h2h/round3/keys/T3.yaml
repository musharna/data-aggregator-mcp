task: T3
prompt: >-
  Find every public dataset, in any archive, with field measurements of methane (dissolved or ice-trapped
  concentrations, diffusive or bubble fluxes, or the composition or isotopes of collected CH4) from thermokarst lakes or
  ponds, or other lakes and ponds formed by permafrost thaw. Compilations that include such measurements count. Lab
  incubations, model or remote-sensing estimates, wetland- or soil-only fluxes, and lakes in permafrost regions that are
  not identified as thaw lakes do not.
criteria: >-
  Topic: PRIMARY (field-measured CH4 from thermokarst / permafrost-thaw lakes and ponds). Included: a public deposit in a
  repository (Arctic Data Center, KNB, PANGAEA, Nordicana D, ORNL DAAC, Zenodo, Figshare, Mendeley Data, Borealis,
  HydroShare, etc.) holding CH4 values measured in the field. That means dissolved CH4 in water or lake ice, diffusive,
  chamber, eddy-covariance or bubble-trap fluxes, or the 13C, D or 14C content of field-collected CH4. The waterbodies
  must be thermokarst, thaw, yedoma or alas lakes or ponds, palsa or peat-plateau thaw ponds, or ponds left by thermokarst
  lake drainage. Thaw origin is taken from the deposit text or, when the deposit is silent, from its linked paper; the
  latter cases are flagged confidence: borderline. Deposits that mix thaw lakes with other sites count if the thaw-lake CH4
  values are in the files. Multi-study compilations count only when their files identify thermokarst or thaw lakes, and
  are flagged borderline. As in round-2 key R5, a publisher supplement mirrored on Figshare counts only when the file
  itself tabulates the CH4 values (borderline). Excluded: lab incubations and production-potential experiments; models,
  gridded upscaling and remote-sensing (SAR, AVIRIS) estimates; maps of ebullition hotspot locations without CH4 values;
  CH4 fluxes from soils, bogs, fens, thaw slumps or drained lake basins with no pond or lake measurement; and microbial,
  DOM or hydrochemistry deposits without CH4. Also excluded are lakes and ponds in permafrost terrain that the deposit and
  paper do not identify as thaw features (Mackenzie Delta floodplain lakes, Yukon-Kuskokwim Delta and Yukon Flats lakes,
  Lena Delta polygonal-tundra ponds, Cambridge Bay waters, where "spring thaw" means ice-out), as are restricted,
  embargoed or login-only records, theses and papers. Unit = study. Version DOIs, concept DOIs, duplicate uploads,
  PANGAEA parent and child datasets of one campaign, and companion deposits of one paper (scripts, literature tables,
  supplement items) are aliases. Separate deposits from different papers are separate studies, even from the same site.
  An umbrella project package with no data of its own is listed as a near miss and points to its keyed children.
