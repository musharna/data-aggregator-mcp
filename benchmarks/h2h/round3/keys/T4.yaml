    archives: [Kaggle, Zenodo]
    evidence: "Kaggle (Jenny Yang): bee_imgs plus bee_data.csv with health (varroa, ants, robbing, missing queen), pollen and subspecies labels. Zenodo TuringREGConnectionsWorkshop_HoneyBees is a re-upload with a byte-identical bee_data.csv (496,983 B). The other Kaggle slugs say they are subsets or splits of this set."
