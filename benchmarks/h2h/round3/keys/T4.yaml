task: T4
prompt: >-
  Find every public labeled image or video dataset, in any archive, of honey bees (Apis mellifera) made for
  computer vision or machine learning: images or video of bees with labels such as Varroa mite presence,
  pollen-bearing, health, caste or behaviour, or bee detection, tracking, pose or segmentation annotations, at
  the hive entrance, on frames or elsewhere. Unlabeled image dumps, audio- or sensor-only hive data, datasets
  whose labelled objects are not bees (comb cells, sticky boards, pollen pellets, isolated wings), general
  insect sets where honey bee is one class among many, other bee species, and papers without a public download
  do not count; copies of a dataset on other sites count as the same dataset.
criteria: >-
  Included: a public, downloadable release in a data archive or dataset platform (Zenodo, Figshare and
  institutional Figshare such as Monash Bridges, Mendeley Data, IEEE DataPort, Kaggle, Hugging Face, Roboflow
  Universe, or a GitHub repository that holds the data under a license) whose images or video show Apis
  mellifera bees and carry labels made for CV/ML: image-level classes (varroa infested vs healthy, pollen vs
  no pollen, health status, caste, behaviour) or object annotations (boxes, points, polygons, keypoints,
  tracks) on bees. The release must say what the images and labels are (a paper's or data paper's dataset, a
  benchmark, or a record whose description documents source and annotation). Unit = one dataset release by one
  group; re-uploads by the same or other users are aliases. A later release by the same group counts as a
  separate study only when it is substantially new data (the 2025 Kaggle EV2 image/video release, 37,890
  frames, versus the 2024 Zenodo EV2 set, 5,170 images). Borderline: data hosted only in a GitHub LFS
  repository with the original host down (BeeAlarmed), labels that sit on derived trajectories or dance
  events rather than plain image annotations (waggle drift), records whose content could not be opened
  (bee MOT set), and hyperspectral scenes labelled only by folder (BUT-HS1). Excluded: comb or brood cell
  images, sticky boards, pollen pellets, wing-venation or queen morphometric photos (the labelled objects are
  not bees); detection or trajectory outputs without images or human labels (RoboRoyale CSVs, BeesBook
  tracks, Bozek 2021 tracks); multi-taxon pollinator or insect sets and ants-vs-bees or bee-vs-wasp toy sets;
  other species (Apis cerana, stingless bees, Andrena, bumblebees); unlabeled or audio/sensor-only data;
  synthetic images and derived features; data available only on request, behind a national login, or on a
  personal Google Drive; and undescribed personal uploads on Kaggle, Roboflow and Hugging Face that give no
  source or label description.
studies:
