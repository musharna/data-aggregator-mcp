    ids: ["ivanfel/honey-bee-pollen", "github.com/piperod/PollenDataset"]
    archives: [Kaggle, GitHub]
    evidence: "Rodriguez, Mégret et al. (WACV 2018) bee crops from entrance video at Gurabo, Puerto Rico, with the class (P or NP) in each file name. The Kaggle card lists PollenDataset/images. The GitHub repo holds Dataset.zip under CC-BY-SA-4.0."
