size_verdict: "ok: 29 distinct studies (all firm, 0 borderline), within the 5-30 range, so the backup topic was not used. Studies per archive (a study is counted for every archive holding one of its ids): SRA 28, GEO 14, Figshare 3, Zenodo 3 (S29 is Zenodo-only; S8 and S14 are Zenodo mirrors of Dryad), Dryad 2, ENA 1 listed explicitly (every SRA study is also mirrored in ENA). That is at least 3 archives with firm studies. The topic is near the 30-study ceiling: three more registered-but-empty projects (P. damicornis ChIP, Aiptasia H3K9ac, A. millepora raw reads) would push it over once released."
