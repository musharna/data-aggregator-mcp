task: V2
prompt: >-
  Find every public dataset, in any archive, that holds chromatin accessibility or chromatin-binding sequencing data
  (ATAC-seq including single-cell ATAC, DNase-seq, ChIP-seq of histone marks, RNA polymerase or transcription factors,
  CUT&RUN or CUT&Tag) generated from a cnidarian: corals, sea anemones, Hydra and other hydrozoans, or jellyfish. Raw
  reads or processed outputs such as peak files both count. Other assays alone (RNA-seq, DNA methylation, Hi-C/Micro-C,
  SELEX, histone proteomics), other animals, reanalyses that deposit no new chromatin data, and registered projects with
  no public data do not count.
criteria: >-
  Topic: PRIMARY (cnidarian chromatin accessibility / chromatin-binding sequencing). Included: a public deposit (SRA/ENA/
  DDBJ reads, GEO series, Zenodo, Figshare, Dryad, etc.) holding ATAC-seq (bulk, sorted-cell, single-cell or multiome),
  DNase-seq, ChIP-seq (histone marks, Pol II, transcription factors, signalling effectors such as pSMAD1/5 or SMAD3),
  CUT&RUN or CUT&Tag reads, or processed outputs of them (peak BED/xls, consensus peaks), generated from any cnidarian
  (Anthozoa, Hydrozoa including siphonophores, Scyphozoa, Cubozoa). Assay and species were confirmed from SRA experiment
  titles and library strategy (run-level), GEO series records, or the deposit's own description; deposits whose library
  strategy is mislabelled (e.g. CUT&Tag filed as OTHER) were judged from experiment titles. Multi-species deposits count
  when their cnidarian samples include qualifying chromatin libraries (counted once, as one study). A genome project
  that includes even a single cnidarian ATAC-seq run counts. Excluded: cnidarian deposits holding only RNA-seq, CAGE,
  bisulfite/EM-seq/nanopore methylation, Hi-C, Omni-C or Micro-C (including an Omni-C run mislabelled
  DNase-Hypersensitivity), SELEX or protein-binding microarrays; histone proteomics; code-only or derived-prediction
  deposits that re-use already-public chromatin data; BioProjects with no public reads or files; DOIs that do not
  resolve; non-cnidarians (the 'coral grouper' and 'coral trout' fish, sponges, ctenophores and placozoans in
  multi-species series were not counted). Unit = study: a GEO series (and its SuperSeries/SubSeries for chromatin data),
  its BioProject(s) and SRA study, and Zenodo/Figshare/Dryad deposits of the same paper's chromatin data (peak files,
  analysis archives, Zenodo mirrors of Dryad) are aliases of one study. RNA-only sibling series of the same paper are not
  listed as aliases. Separate deposits from different papers are separate studies.
