queries:
  - "PRIMARY topic, DataCite https://api.datacite.org/dois (cursor-paged): title turbine* AND (bat|bird|avian|fatalit*|mortality|carcass*|collision*) OR description 'wind turbine' AND (carcass*|fatalit*|collision*): 519; ('wind farm*'|'wind energy'|'wind power'|'wind facilit*'|'wind turbine*'|windfarm*|'wind project*'|'wind plant*') AND (carcass*|fatalit*|mortality|'searcher efficiency'|scavenging|'carcass persistence'|collision*|killed|strike*) AND (bat|bird|avian|raptor*|eagle*|Chiroptera) OR Schlagopfer*|Kollisionsopfer*: 737. About 25 research deposits found (Dryad, Zenodo, Mendeley, USGS, Figshare, Recherche Data Gouv)."
  - "PRIMARY topic, Zenodo https://zenodo.org/api/records: (turbine|'wind farm'|'wind energy'|'wind power'|windfarm) AND (carcass|fatalit*|mortality|collision*|killed) AND (bat|bird|avian|raptor|eagle) AND resource_type.type:dataset: 47. Dryad /api/v2/search: 'wind turbine carcass' 6; 'wind turbine fatality' 11; 'wind farm mortality bats' 2; 'wind farm mortality birds' 4; 'wind turbine collision' 28; 'carcass persistence' 25; 'searcher efficiency' 1; 'wind energy fatalities' 9; 'eagle wind turbine' 7; 'bats killed wind' 7. Figshare /v2/articles/search: four field queries (0, 0, 46, 500) and six phrase queries (500-capped; PLOS/ESA/RS supplements). Mendeley Data: 4 queries. ScienceBase /catalog/items: 16 queries (0-193 hits; P14NMJJR, P937H9LQ, P9M0S3BV, hoary-bat genetics)."
