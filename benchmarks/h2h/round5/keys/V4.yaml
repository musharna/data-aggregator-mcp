task: V4
prompt: >-
  Find every public dataset, in any archive, that holds records of birds colliding with buildings, windows or other glass
  structures: carcass or collision surveys at buildings, citizen-science collision reports, counts or case records of
  building/window-collision victims, or field and flight-tunnel tests of glass or window treatments with birds. Raw or
  processed data both count. Collisions with wind turbines, power lines, towers, vehicles or aircraft, studies that only use
  window-killed birds as specimens for unrelated questions, opinion surveys of people, code-only deposits and papers without
  deposited data do not count.
criteria: >-
  Topic: BACKUP (bird collisions with buildings or glass); the primary topic (wind-turbine carcass search / collision
  monitoring) failed the size gate (see size_verdict). Included: a public deposit holding bird collision records at
  buildings, windows, glass facades, glass bus shelters or illuminated buildings (per-carcass or per-incident records,
  collision counts per building/facade/night, searcher-efficiency and carcass-persistence trials of collision surveys,
  citizen-science collision reports, rehabilitation case records of building-collision victims), or experimental tests of
  glass/window treatments with birds (field BACI tests, flight-tunnel choice tests). Deposits in a general archive (Dryad,
  Zenodo, Figshare, Mendeley Data, OSF, GBIF/SiB Colombia, Kaggle) count; journal supplementary data files hosted on Figshare
  or Zenodo by the publisher (PLOS, Pensoft, SciELO) are kept but flagged borderline, as are datasets whose rows are
  building-collision specimens but whose study question is not collisions (morphology time series of Chicago collision
  specimens) and unattributed re-uploads. Excluded: collisions with wind turbines, power lines, communication towers,
  vehicles or aircraft; bats; light-attraction trapping without building collisions; general wildlife-rehabilitation or
  museum datasets where window collision is one cause among many; opinion/behaviour surveys of residents or students;
  code-only deposits; posters, theses, reviews and article PDFs; journal tables that exist only inside the article.
  Unit = study: Dryad deposits and their Zenodo mirrors, concept/version DOIs and copies of the same files are aliases.
