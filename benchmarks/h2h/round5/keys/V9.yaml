task: V9
prompt: >-
  Find every public dataset, in any archive, that holds culture-independent metagenomic (shotgun) or amplicon
  (16S/18S/ITS) sequencing of the wastewater side of hospital plumbing: sink drains, drain covers and tailpieces, P-traps
  / sink traps, toilets, shower, bath or floor drains, and in-building sewer pipework of hospitals. Raw reads or processed
  community tables both count, and studies that also sampled other sites count if the drain/trap samples are part of the
  deposit. Isolate-only genome sequencing, species-specific typing amplicons, culture-only work, lab model drains, drinking
  water supply/faucets, non-hospital buildings, and pooled hospital effluent or sewage do not count.
criteria: >-
  Topic: PRIMARY. Included: a public deposit (INSDC SRA/ENA/DDBJ BioProject, Zenodo, Figshare, etc.) of shotgun
  metagenomes or community-marker amplicons (16S/18S rRNA, ITS) generated directly (culture-independently) from samples
  of hospital wastewater plumbing inside the building: sink drain biofilm or swabs, drain covers, tailpieces, P-trap /
  sink-trap / waste-trap water or biofilm, toilet bowl/drain, burns-bath, shower and floor drains or traps, and sewer
  biofilm within a hospital's pipework. Mixed-site studies count when drain/trap samples are among the deposited samples.
  Long-read MinION metagenomes count. Healthcare means human hospitals. Borderline: sinks sampled only as basin/sink
  swabs where the drain itself is not specified; hospital-derived plumbing studied ex situ; biofilm coupons in hospital
  sewers sampled alongside effluent. Excluded: isolate WGS (even of sink-drain isolates), HiSST or other species-typing
  amplicons, culture/plate-sweep metagenomes, culturomics or qPCR-only studies, laboratory sink-drain models, drinking
  water/faucet/shower-hose supply side, sink rims, taps and surfaces, university/residential/veterinary/food-industry
  sinks, pooled hospital effluent/sewage and treatment plants, registered BioProjects with no released data, and journal
  supplement PDFs. Unit = study: a BioProject, its SRA/ENA/DDBJ study accessions and any Zenodo/Figshare copies of the
  same study's processed tables are aliases. Separate BioProjects from different papers are separate studies; isolate-only
  sibling BioProjects of a qualifying paper are not aliases. Every keyed accession was fetched from the ENA portal API
  and/or NCBI E-utilities (run counts, library strategy/source, BioSample isolation source), with linked papers checked
  in Europe PMC full text where available.
