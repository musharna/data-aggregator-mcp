    archives: [IEEE DataPort, Kaggle, Hugging Face]
    evidence: "IEEE DataPort open-access page (both DataCite DOIs resolve to the same URL): one 565 MB zip of wav files plus xlsx for 15 young controls, 22 elderly controls and 28 PD patients (Dimauro et al. 2017 IEEE Access), CC BY, free IEEE login needed; the Hugging Face and Kaggle uploads cite DOI 10.21227/aw6b-tg17 and list the same B1/B2/PR1*.wav files."
