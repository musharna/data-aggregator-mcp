    archives: [Kaggle]
    evidence: "confidence: borderline (Kaggle re-upload of a GitHub repository 'Parkinson-Patient-Speech-Dataset-master' with no description). Kaggle API: 411 MB, MIT licence, denoised-speech-dataset/ folders of per-speaker wav and txt files (DL, Faces/BG_au, Faces/JC_au) plus DL_au_all.csv."
