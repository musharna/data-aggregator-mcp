    evidence: "Zenodo API and download of MDP3.zip (38.6 MB, then deleted): 40 MP3 files in MDP3/PARKINSON and MDP3/NORMAL from 17 PD and 23 control native Arabic speakers (vowels, reading passage, spontaneous speech; Hassanat et al. 2026, 10.1177/11795735261448278)."
