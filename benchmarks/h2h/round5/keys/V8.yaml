task: V8
prompt: >-
  Find every public dataset, in any archive, that holds audio recordings of the speech or voice of people with
  Parkinson's disease (sustained vowels, reading, diadochokinetic syllables, spontaneous speech, and so on) that can be
  used for acoustic analysis; datasets that also include healthy controls or other conditions count if they contain
  Parkinson's speakers. Tables of acoustic features or measurements without the audio, synthetic or simulated voices,
  animal models, recordings available only by application or under a data use agreement, and papers without deposited
  audio do not count.
criteria: >-
  Topic: PRIMARY (speech/voice recordings of people with Parkinson's disease, for acoustic analysis). Included: a public
  deposit (Zenodo, Figshare, IEEE DataPort, journal-supplement platforms on Figshare, NAKALA, Kaggle, Hugging Face, etc.)
  whose files include audio (wav/mp3, or video with the speech soundtrack) of human speakers diagnosed with idiopathic
  Parkinson's disease. Deposits that are openly downloadable or need only a free account (IEEE DataPort open access,
  Kaggle) count as public. Copies and mirrors of one corpus on other platforms (Figshare, Kaggle, Hugging Face re-uploads)
  are aliases of the original study. Flagged confidence: borderline are journal-supplement audio or video examples (a
  few files illustrating a paper rather than a dataset), a single teaching example, resynthesized or synthesized replicas
  of real PD voices, processed speech clips whose format could not be confirmed, and re-uploads whose provenance is not
  stated. Excluded (near_misses): feature-only or measurement-only tables, even when extracted from PD recordings (UCI
  Parkinsons, Telemonitoring, Sakar, Naranjo, Neurovoz Rasta-PLP, Mendeley feature sets, OSF Praat/formant tables);
  restricted, credentialed or application-only corpora (NeuroVoz, EWA-DB, ParkCeleb, HeyJay!, Bridge2AI-Voice, mPower,
  Radboud CHASING, Zenodo restricted records); synthetic data; perceptual ratings without audio; journal supplements of
  PDFs, docx or tables; animal models (Pink1-/- rat, zebra finch); other disorders without PD speakers (ALS, ataxia,
  corticobasal syndrome, cerebral palsy, TORGO/UA-Speech); code-only records.
studies:
  - key: S1
    title: "Mobile Device Voice Recordings at King's College London (MDVR-KCL) from both early and advanced Parkinson's disease patients and healthy controls"
    year: 2019
    ids: ["10.5281/zenodo.2867216", "10.5281/zenodo.2867215", "zenodo:2867216", "10.6084/m9.figshare.32588973", "10.6084/m9.figshare.32588973.v1", "10.6084/m9.figshare.32588973.v2", "kaggle:nutansingh/mdvr-kcl-dataset", "kaggle:shivam17818/parkinsons-dataset", "huggingface:Hahad14/Parkinsons_Disease_Speech", "huggingface:harishBattula2/Parkinsons_Disease_Speech"]
    archives: [Zenodo, Figshare, Kaggle, Hugging Face]
    evidence: "Zenodo API: open record with 26_29_09_2017_KCL.zip (606 MB) of smartphone recordings (ReadText and SpontaneousDialogue) of early/advanced PD patients and controls made at KCL in Sept 2017; the Figshare 'Parkinson-Disease-voice-Dataset' (39 files ID02_pd_2_0_0.wav ...) and the Kaggle/Hugging Face uploads list the same IDxx_pd/hc_*.wav files under 26-29_09_2017_KCL/ReadText, so they are copies."
  - key: S2
