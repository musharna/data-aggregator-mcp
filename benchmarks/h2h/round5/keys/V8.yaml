    archives: [Zenodo]
    evidence: "confidence: borderline (dataset.zip is 1.3 GB, so the clip format could not be confirmed). Zenodo API: 'processed speech clips' (266 PD and 236 non-PD from public sources, plus 163 PD and 295 non-PD from Xinjiang Medical University) paired with MRI for ParkMultiNet."
