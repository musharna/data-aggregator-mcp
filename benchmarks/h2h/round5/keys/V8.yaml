    archives: [Figshare]
    evidence: "Figshare API: A_Audios.zip (50 MB) with folders A_EP_Audios and A_noEP_Audios of sustained /a/ from Argentine speakers with and without PD, plus data_information.csv (age, sex, disease duration; Giuliano et al., UNLaM)."
