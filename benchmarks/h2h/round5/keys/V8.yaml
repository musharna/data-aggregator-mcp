    archives: [Figshare, Kaggle]
    evidence: "Figshare API: PD_AH.zip and HC_AH.zip of telephone-recorded sustained /a/ wav files plus Demographics_age_sex.xlsx (Iyer, Kemp, Virmani, Prior et al., UAMS; data-availability statement of PMC10667335); the Kaggle copy lists 40 PD_AH and 41 HC_AH wav files."
