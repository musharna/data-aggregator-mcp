    year: 2019
    ids: ["10.23641/asha.8637008", "10.23641/asha.8637008.v1"]
    archives: [Figshare (ASHA journals)]
    evidence: "confidence: borderline (three small illustrative video clips, 0.4-0.6 MB). Figshare API: SuppS1-S3.mp4 for a JSLHR study of connected-speech acoustics in PD and controls under single- and dual-task conditions."
