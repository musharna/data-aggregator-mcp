size_verdict: "ok but at the floor: 5 distinct firm studies (0 borderline) across 9 archives (studies per archive: GEO 2, SRA 2, GSA 1, DDBJ 1, Figshare 1, ArrayExpress 1, ENA 1, NGDC BioProject 1 (umbrella alias of S4), gEAR 1). This meets the 5-30 firm, at-least-3-archive gate, so the backup topic was not used. S2 counts as firm only because the criteria treat the vestibular ganglion as inner-ear tissue. Known inner-ear spatial preprints without findable deposits (Jean et al. 2026 Visium HD developing cochlea; Liang et al. 2026 human fetal utricle imaging-based spatial; Lallemend et al. 2026 vestibular spatial mapping) could raise the count once their data are released."
