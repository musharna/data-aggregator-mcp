task: V1
prompt: >-
  Find every public dataset, in any archive, that holds spatially resolved gene-expression data (sequencing- or
  imaging-based spatial transcriptomics such as Visium / Visium HD, Stereo-seq, Slide-seq, MERFISH, Xenium, GeoMx,
  seqFISH or similar) measured on tissue of the inner ear of any vertebrate: the cochlea, the vestibular organs, or the
  spiral and vestibular ganglia. Raw or processed spatial data both count. Whole-embryo or whole-head atlases that only
  happen to include the ear, brainstem auditory nuclei, vestibular schwannomas and other tumors, outer or middle ear,
  inner-ear organoids, dissociated single-cell / single-nucleus data without a spatial assay, few-probe in situ
  hybridization, and papers whose spatial data were never deposited do not count.
criteria: >-
  Topic: PRIMARY (spatial transcriptomics of the vertebrate inner ear). Included: a public deposit (GEO/SRA,
  ArrayExpress/ENA, GSA/DDBJ, Figshare, gEAR, etc.) of spatially barcoded or in situ, transcriptome- or panel-scale gene
  expression (Visium/Visium HD, Stereo-seq or other spatial-seq, GeoMx DSP, Xenium, MERFISH, seqFISH, Slide-seq) whose
  tissue is the inner ear: cochlear duct / organ of Corti, lateral wall, modiolus and spiral ganglion, vestibular end
  organs, or the vestibular (Scarpa's) ganglion, which is counted as inner-ear tissue because it holds the primary
  afferents of the vestibular end organs. Raw reads, count matrices, spot/cell coordinate tables and processed h5ad
  objects all count; a deposit holding only spot metadata or figure tables of a spatial study counts as an alias of that
  study when the raw data are deposited elsewhere. Species, tissue and technique were confirmed from the deposit
  metadata and file listing, or, if these were silent, from the linked paper. Excluded: whole-embryo / whole-head /
  craniofacial spatial atlases where the ear is one region among many (MOSTA, craniofacial atlases); cochlear nucleus and
  other brain regions; vestibular schwannoma and other tumors; outer-ear skin; inner-ear organoids; scRNA-seq, snRNA-seq,
  bulk or regional RNA-seq, and computational spatial reconstructions from dissociated cells; HCR / RNAscope-type
  few-gene imaging; papers whose spatial data are only in figures or supplements; restricted-access deposits. Unit =
  study: a GEO series with its BioProject/SRA study, an ArrayExpress experiment with its ENA project, an NGDC umbrella
  project, GSA/DDBJ mirrors, and Figshare or gEAR views of the same data are aliases of one study. Sibling deposits of
  the same paper that hold only non-spatial data (scRNA-seq, bulk RNA-seq, multiome) are not aliases; they are near
  misses.
studies:
  - key: S1
    title: "Heat-Shock Pathway Activation by TRC-051384 Protects Spiral Ganglion Neurons from Noise-Induced Hearing Loss [Spatial Transcriptomics]"
    year: 2025
    ids: ["GSE312646", "PRJNA1375652", "SRP651704"]
    archives: [GEO, SRA]
    evidence: "GEO series and sample records: GeoMx Mouse Whole Transcriptome Atlas on fresh-frozen cochlear sections of 16-week CBA/CaJ mice (mock vs 100 dB SPL noise), 51 neuron and supporting-cell ROIs (tissue: cochlea); files GSE312646_GeoMX_table.csv.gz and RAW.tar; 51 public SRA runs under SRP651704 (Yu et al. 2026 JCI Insight, PMID 41415422)."
  - key: S2
    title: "Morphological and Functional Diversity of Spatially Resolved Vestibular Ganglion Neuron Cell Types (Visium HD)"
    year: 2026
    ids: ["GSE309565", "PRJNA1335542", "SRP629162"]
    archives: [GEO, SRA]
    evidence: "GEO: Visium HD CytAssist sections of adult mouse vestibular ganglion (GSM9269270 WT male, GSM9269271 Tmie KO female) with SpaceRanger binned-output tarballs; ENA/SRA lists runs '10x visiumHD of mus musculus: adult ... vestibular ganglion' under SRP629162 (Liu et al. 2026 PNAS, PMID 42412930)."
  - key: S3
    title: "mm_inner ear_spatial-seq: spatial transcriptomics of the mouse cochlea at E17.5, P8 and adult (Yan et al., tonotopic organization)"
    year: 2025
    ids: ["PRJCA031138", "CRA019653", "PRJDB33021", "DRP015037", "10.6084/m9.figshare.33027089", "10.6084/m9.figshare.33027089.v1", "10.6084/m9.figshare.33030437", "10.6084/m9.figshare.33030437.v2"]
    archives: [GSA, DDBJ, Figshare]
    evidence: "NGDC BioProject PRJCA031138 (submitter Mengzhen Yan, released 2025-05-01) and GSA CRA019653 hold three 'single-cell spatial-seq datasets from mouse inner ear' (samples mm_cochlea_E17.5, _P8, _2M), mirrored as DDBJ PRJDB33021/DRP015037 with public runs DRR787634-6. The same author's Figshare items hold per-section spatial spot metadata (E17.5/P8/adult SCT_metadata.txt) and figure tables. All match bioRxiv 10.1101/2024.10.30.621022."
  - key: S4
    title: "A Human Fetal Cochlear Cell Atlas Reveals a Regulatory Blueprint for Spatial Patterning (Stereo-seq)"
    year: 2026
    ids: ["E-MTAB-16462", "PRJEB105893", "ERP187045", "E-MTAB-16513", "PRJEB106161", "ERP187267", "PRJCA057841"]
    archives: [ArrayExpress, ENA, NGDC BioProject]
    evidence: "ArrayExpress 'spatial transcriptomics by high-throughput sequencing' records (organism part: cochlea) give Stereo-seq of human fetal cochleae at 10, 14 and 16 PCW, with processed .gef, bin20/bin50/cellbin .h5ad and metadata csv files; the ENA projects hold the DNBSEQ-T7 reads (5 + 1 runs). Stereo-seq-2 is a second part of the same study. NGDC PRJCA057841 (Wenyan Li, Fudan EENT) is the umbrella project. No journal article was found in Europe PMC."
  - key: S5
    title: "Xenium Analysis of P8 WT Mouse Inner Ear Sections (Hertzano lab, gEAR)"
    year: 2024
    ids: ["gEAR:f50389ab", "f50389ab", "59a45c1c-3125-ac4d-590c-dc6379e29c23", "7e256740", "83590bd2", "62ef8043", "9d71b642", "a56fe32b", "3429de90"]
    archives: [gEAR]
    evidence: "gEAR search API: public, downloadable dataset of P8 wild-type mouse inner ears (PFA-fixed, decalcified, 5 um paraffin sections, Xenium custom panel). The h5ad (27 MB, downloaded then deleted) contains Centroid_X/Centroid_Y, nCount_Xenium and CellType fields with inner-ear genes (Tecta, Tmem145, Sox10). The other share ids are UMAP/violin/zoom and 'mesenchymal removed' views of the same data. No GEO or paper link is given."
