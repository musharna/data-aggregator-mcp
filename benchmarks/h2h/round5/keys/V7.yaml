size_verdict: "ok: 15 distinct studies (9 firm, 6 borderline) across 8 archives. Firm studies per archive: UK Polar Data Centre 6, Zenodo 2 (S7; S8 mirror), Dryad 1, Science Data Bank 1, plus Roboflow Universe as an unverified alias of S7. Borderline: Zenodo 2, Figshare 2, Harvard Dataverse 1, Kaggle 1. The 9 firm studies across 4 archives meet the 5-30 range with at least 3 archives, so the backup topic (pinnipeds) was not used."
