task: V7
prompt: >-
  Find every public dataset, in any archive, that holds aerial, drone (UAV) or satellite images of whales with
  annotations marking the individual whales (points, bounding boxes, masks or labelled image chips), or the per-whale
  annotation layers drawn on such images, made to train, test or carry out detection or counting of whales. "Whales"
  means any baleen or toothed whale, including beluga, narwhal, sperm, pilot and killer whales. These do not count:
  dolphin- or porpoise-only sets; photo-identification or re-identification sets; photogrammetry or body-condition
  measurements; raw imagery without annotations; observer sighting or group-count tables; acoustic detections; and
  code-only repositories.
criteria: >-
  Topic: PRIMARY (annotated aerial/drone/satellite imagery of whales for detection or counting). Included: a public
  deposit holding (a) overhead imagery (crewed aircraft, UAV/drone, or very-high-resolution optical/SAR satellite) of
  whales together with per-animal annotations (points, boxes, polygons/masks, or class-labelled image chips), or (b) the
  per-whale annotation layer alone (e.g. geolocated points with image catalogue IDs) where the commercial satellite
  imagery cannot be redistributed. The deposit's stated purpose must be detection, counting, or training/validation of
  detectors. Mixed whale + dolphin/seal sets count if whales are annotated. Flagged confidence: borderline when the
  imagery is synthetic, the files are still under embargo, the contents could not be inspected, the annotations sit
  inside a code release, or the annotations were made mainly for another purpose (behaviour, re-identification) but are
  still per-whale detection masks/boxes on drone imagery. Excluded: dolphin/porpoise-only sets; photo-ID/re-ID sets with
  pre-cropped animals; photogrammetry/morphometrics/body-condition tables; raw unannotated aerial or drone imagery and
  video; aerial-observer sighting, count or detection-probability tables; telemetry; acoustic detection data; code-only
  repositories; figure/table extracts of articles (Plazi/Zenodo) and article copies; posters and presentations. Unit = study:
  copies, versions, concept/version DOIs, Dryad-to-Zenodo mirrors, a Roboflow export re-deposited on Zenodo, and
  multiple deposits from the same dataset paper are aliases of one study.
studies:
  - key: S1
    title: "Whales from Space Database (annotation shapefiles) and Whales from Space Database: Image chips"
    year: 2021
    ids: ["10.5285/c1afe32c-493c-4dc7-af9f-649593b97b2c", "10.5285/90fab89e-5d07-4d5c-b619-60799a4d09f8", "GB/NERC/BAS/PDC/01482", "GB/NERC/BAS/PDC/01592"]
    archives: [UK Polar Data Centre]
    evidence: "DataCite and the PDC/RAMADDA pages: 633 annotated whale objects plus 120 confounders as point/box shapefiles ('Point-Box_Shapefiles' folder) with PNG image chips in the sister record, from WorldView/GeoEye/QuickBird imagery, made for training ML whale detectors. Both are cited by the dataset paper (Cubaynes & Fretwell 2022 Sci Data, PMC9142526), so they are one study."
  - key: S2
    title: "Annotated dataset of grey whales detected in Very High Resolution (VHR) satellite imagery of Baja California Sur lagoons in 2009, 2013 and 2015"
    year: 2024
    ids: ["10.5285/2d8a4b45-e21f-47d4-8279-b4362489301e", "GB/NERC/BAS/PDC/01827"]
    archives: [UK Polar Data Centre]
    evidence: "RAMADDA file list: point shapefiles Whales_SanIgnacio_2009, Whales_OjoLiebre_2013 and _2015, plus a README. Each point is a manually detected grey whale in WorldView-2/GeoEye-1 imagery, with certainty and feature attributes; the stated purpose is training ML whale detection."
  - key: S3
    title: "Annotated dataset of beluga whales detected in Very High Resolution (VHR) satellite imagery of the southern Kara Sea (Russia) in July 2016"
    year: 2024
    ids: ["10.5285/ae34b490-4838-4740-a78e-924d23dc5540", "GB/NERC/BAS/PDC/01829"]
    archives: [UK Polar Data Centre]
    evidence: "RAMADDA file list: point shapefiles belugas_4July_YugorPeninsula and belugas_9July_BaydaratskayaBay (1 MB dbf) plus a README. These are manually detected belugas in WorldView-2/3 imagery, made to support training of automatic whale detection."
  - key: S4
    title: "Point annotation dataset of stranded whale and dolphin species identified in very high-resolution optical and SAR satellite imagery along offshore islands of New Zealand and Tasmania between 2018-2023"
    year: 2025
    ids: ["10.5285/b26c3a3d-73c8-4500-9a23-696011c20a45", "GB/NERC/BAS/PDC/02083"]
    archives: [UK Polar Data Centre]
    evidence: "DataCite/PDC page: point annotations of stranded sperm whales and pilot whales in VHR optical and SAR satellite imagery, made to test satellite detection of strandings (linked code: GitHub strandings_from_space). The landing page resolves; RAMADDA did not expose a file list."
  - key: S5
    title: "Happy Humpbacks: A machine learning-ready drone dataset for whale detection model development"
    year: 2026
    ids: ["10.5285/7a952870-9880-415d-a8ab-194fedf01a26", "GB/NERC/BAS/PDC/02202"]
    archives: [UK Polar Data Centre]
    evidence: "DataCite/PDC page: 5,281 DJI Phantom 4 Pro drone images from Palmer Station (2020) with 10,401 humpback whale bounding boxes in LabelMe and COCO formats and train/val/test splits, for object detection. The landing page resolves; RAMADDA did not expose a file list."
  - key: S6
    title: "Locations of features of interest from a multi-season (2018-2022) baleen whale-focused survey of Wilhelmina Bay, Western Antarctic Peninsula, using WorldView-03 satellite imagery"
    year: 2025
    ids: ["10.5285/ab19aaba-12d6-44a7-89a3-7b45af0343ed", "GB/NERC/BAS/PDC/02045"]
    archives: [UK Polar Data Centre]
    evidence: "DataCite/PDC page: 819 whale features of interest annotated and classified by seven observers over ~1,900 km2 of WorldView-3 imagery, explicitly meant as training data for automated detection. It is the deposit named in the data descriptor (Sci Data 2025, PMC12864722)."
  - key: S7
    title: "Dataset for the study \"Localization and tracking of beluga whales in aerial video using deep learning\""
    year: 2025
    ids: ["10.5281/zenodo.15679220", "10.5281/zenodo.15679219", "roboflow:object-detection/beluga_1080", "https://universe.roboflow.com/object-detection/beluga_1080"]
    archives: [Zenodo, Roboflow Universe]
    evidence: "Zenodo files are detection_data.zip (22 MB) and tracking_data.zip (534 MB). I listed detection_data.zip: train/valid/test aerial video frames with YOLO label txt files for 'Beluga' and 'Beluga Calf' (Alsaidi et al. 2024 Front Mar Sci). The bundled README says it is the Roboflow export 'Beluga_1080'. The Roboflow alias comes from that README only, because universe.roboflow.com returned a Cloudflare challenge (403)."
  - key: S8
    title: "Data from: Drones and convolutional neural networks facilitate automated and accurate cetacean species identification and photogrammetry"
    year: 2019
    ids: ["10.5061/dryad.7482v2n", "10.5281/zenodo.4933008", "10.5281/zenodo.4933007"]
    archives: [Dryad, Zenodo]
    evidence: "Dryad file API and the Zenodo mirror both list train_subset_1/2.zip, val.zip and test.zip (2.3 GB in total) of drone images of humpback, minke and blue whales with VIA region (mask) labels, used to train a Mask R-CNN whale detector/segmenter (Gray et al. 2019 MEE 10.1111/2041-210x.13246)."
  - key: S9
    title: "A beluga whale distribution dataset for the Canadian sub-Arctic derived from 2021–2022 WorldView imagery"
    year: 2026
    ids: ["10.57760/sciencedb.j00001.01659", "scidb:093922e8ee574ad1a9cbd78b112bc4a6"]
    archives: [Science Data Bank]
    evidence: "DataCite (20 files, 98 KB, CC BY) and doi.org resolve to scidb.cn: geolocations of 721 certain belugas, 477 uncertain belugas and 551 harp seals annotated in WorldView-2/3 imagery of Cumberland Sound and the Churchill estuary, made for object-detection training and evaluation (YOLOv8; matches arXiv 2505.12066). The file API needs login, so the file list was not seen."
  - key: S10
    title: "Synthetic Satellite Images of Southern Right Whales and Beluga Whales"
    year: 2026
    ids: ["10.5281/zenodo.18776518", "10.5281/zenodo.18776517"]
    archives: [Zenodo]
    evidence: "confidence: borderline (the imagery is synthetic, generated from real WorldView/GeoEye chips). I listed Synthetic_Beluga_Data.zip (19 MB): 432 PNG chips with YOLO txt labels plus train/valid COCO json. Sythentic_SRW_Data.zip (18 MB) holds the right-whale set. Released with Duporge et al. 2025 'Enhancing Satellite-Based Detection of Marine Fauna Using Synthetic Data'."
  - key: S11
    title: "A cetacean detection dataset for convolutional neural networks YOLOv8"
    year: 2026
    ids: ["10.6084/m9.figshare.33193551", "10.6084/m9.figshare.33193551.v1", "10.6084/m9.figshare.33193551.v2", "10.6084/m9.figshare.33193551.v3"]
    archives: [Figshare]
    evidence: "confidence: borderline (files are under embargo until 2026-10-31, so none are listed yet). The Figshare API describes YOLO-format box labels (806 MB) on frames from long-endurance UAV transect video (244 m altitude, Pelagos Sanctuary) for fin, sperm, Cuvier's beaked and pilot whales plus Risso's and striped dolphins."
  - key: S12
    title: "Summer Beluga Detection Manuscript"
    year: 2024
    ids: ["10.6084/m9.figshare.25966288", "10.6084/m9.figshare.25966288.v1"]
    archives: [Figshare]
    evidence: "confidence: borderline (the single 'algorithm files.zip' (0.9 MB) could not be downloaded, as Figshare returned HTTP 500/202, so whether it holds whale annotations or only OBIA rule sets is unknown). It is the deposit named in the data statement of the PLoS ONE 2024 paper on OBIA detection and enumeration of belugas in WorldView-3 imagery (PMC11560058)."
  - key: S13
    title: "lynch-lab/Borowicz_etal_Spacewhale: Aerial-trained deep learning networks for surveying cetaceans from satellite imagery"
    year: 2019
    ids: ["10.5281/zenodo.3356970", "10.5281/zenodo.3356969"]
    archives: [Zenodo]
    evidence: "confidence: borderline (a software release, but it bundles the training imagery). The Zenodo zip (99 MB) is the GitHub release, which contains 31cmAerialImagery.zip: I listed 194 PNG aerial image chips of minke whales downsampled to satellite resolution, used to train whale/water CNN classifiers (Borowicz et al. 2019 PLoS ONE, PMC6772036)."
  - key: S14
    title: "Project CETI Sperm Whale Birth Videos with Segmentations and Annotations"
    year: 2025
    ids: ["10.7910/DVN/SWIHAN", "doi:10.7910/DVN/SWIHAN"]
    archives: [Harvard Dataverse]
    evidence: "confidence: borderline (made for a behavioural study of a birth, not for detection or counting). The Dataverse API lists 120 files: drone videos, per-video _segmentations.hdf5, and boxes-/masks-orientation overlay videos. These hold ML-generated, manually verified per-whale segmentation masks for 11 sperm whales (Science 10.1126/science.ady9280)."
  - key: S15
    title: "Whale identification (drone photos with whale masks, Whale_ReId)"
    year: 2023
    ids: ["kaggle:opamusora/whale-identification", "https://www.kaggle.com/datasets/opamusora/whale-identification"]
    archives: [Kaggle]
    evidence: "confidence: borderline (made for re-identification; each image has a whale segmentation mask). The Kaggle API shows 990 MB in per-individual folders (Whale_ReId_test_mm/...) of drone photos plus whale masks, from a 2022 Russian Ministry of Natural Resources hackathon. The licence is listed as Unknown."
