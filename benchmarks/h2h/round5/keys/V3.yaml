task: V3
prompt: >-
  Find every public dataset, in any archive, that holds brain imaging or brain recording data (structural or
  functional MRI, diffusion MRI/DTI, EEG or event-related potentials, MEG, fNIRS) from people who stutter (children or
  adults with developmental stuttering, usually compared with fluent controls). Raw or processed data both count,
  including group statistical maps and per-participant derived measures. Speech-audio, behavioural, questionnaire,
  genetic, kinematic or vocal-tract-only data, fluent speakers imitating stuttering, meta-analysis maps built from
  published coordinates, journal supplement PDFs or summary tables, and deposits that are not openly accessible do not count.
criteria: >-
  Topic: PRIMARY (brain imaging/recording of people who stutter). Included: an openly accessible deposit (OSF, NeuroVault,
  Zenodo, Mendeley Data, Dataverse installations such as GRO.data, Figshare, etc.) whose files hold MRI/fMRI/DTI,
  EEG/ERP, MEG or fNIRS data from people who stutter (PWS/AWS/CWS), raw or processed: cleaned or epoched recordings,
  source/ROI time series, per-participant spectral, ERP, ERPAC or laterality values, and group-level statistical maps
  (including maps of PWS alone or PWS vs controls). Group membership and modality were confirmed from the deposit text
  and file names or, where silent, from the linked paper (Europe PMC full text or preprint). Journal supporting-information
  files that hold per-participant brain measures are kept but flagged borderline. Excluded: speech/audio corpora,
  behavioural, questionnaire, genetic, physiological (autonomic) and articulatory/vocal-tract MRI data; TMS motor-evoked
  potentials; fMRI/fNIRS of fluent speakers simulating disfluency; ALE meta-analysis maps and their classroom copies;
  journal supplement PDFs, figures and group-summary tables; preregistrations and code-only or empty projects; private
  or login-gated records (OSF 401, INFN login redirect); NDA-style controlled access. Unit = study: concept/version DOIs,
  OSF GUID and DOI, NeuroVault numeric id and private-link key, and qualifying deposits of the same paper in two archives
  are aliases of one study; sibling deposits of the same paper that hold only behaviour or PDFs are near misses.
studies:
  - key: S1
    title: "Adjusted power of resting state EEG data in typically fluent and adults who stutter"
    year: 2024
    ids: ["10.17632/v6346g59xh", "10.17632/v6346g59xh.1"]
    archives: [Mendeley Data]
    evidence: "Mendeley public API: 62 files (8.7 MB) of 128-channel EGI EEG component spectra and mu/alpha/theta ERD .mat/.xlsx split by fluent (c) and stuttering (st) groups, 23 AWS and 23 fluent adults (Bowers; Neuropsychologia 10.1016/j.neuropsychologia.2024.108906)."
  - key: S2
    title: "classification of stuttering events and ERPAC data"
    year: 2026
    ids: ["10.5281/zenodo.22982941", "10.5281/zenodo.22982940"]
    archives: [Zenodo]
    evidence: "Zenodo record 22982941 (concept 22982940): Alldata6a.xlsx holds per-participant left/right hemisphere alpha/beta EEG ERPAC measures for controls (c1..) and stutterers (s1..) with OASES scores; plus R code (Saltuklaroglu)."
  - key: S3
    title: "Data - Stuttering and social speech"
    year: 2026
    ids: ["10.25625/OQBVSL", "doi:10.25625/OQBVSL"]
    archives: [GRO.data (Göttingen Research Online Dataverse)]
    evidence: "Dataverse API: 23 NIfTI fMRI maps (Neef, UMG) including ANOVA Interaction/Mode/Person maps for aws, awns and aws-vs-awns, share-vs-private maps correlated with OASES/PAiS in AWS, averageBOLD; group-level processed only."
  - key: S4
    title: "Cortical tracking of speech is reduced in adults who stutter when listening for speaking"
    year: 2023
    ids: ["osf.io/7gpyb", "7gpyb"]
    archives: [OSF]
    evidence: "OSF files API: data/EEG_data_clean/stutt/ and /contr/ hold per-subject cleaned EEG .mat (~180 MB each, comp and prod tasks) plus coherence files (153 entries); Gastaldon et al. 2024 JSLHR (10.1044/2024_jslhr-24-00227), AWS vs TFA."
  - key: S5
    title: "Data for 'When inefficient speech-motor control affects speech comprehension: atypical electrophysiological correlates in stuttering'"
    year: 2021
    ids: ["osf.io/5jkur", "5jkur"]
    archives: [OSF]
    evidence: "OSF files: ERP_differential.RData, Comprehension_/Production_differential.RData (ROI time-frequency data) and RTs; README ties them to Gastaldon et al. 2023 Cereb Cortex (10.1093/cercor/bhad004), AWS vs controls. Processed EEG only."
  - key: S6
    title: "No Evidence of Altered Language Laterality in People Who Stutter across Different Brain Imaging Studies of Speech and Language"
    year: 2024
    ids: ["10.17605/OSF.IO/TQ8J5", "osf.io/tq8j5", "neurovault:collection:16872", "https://neurovault.org/collections/16872/"]
    archives: [OSF, NeuroVault]
    evidence: "OSF files: Data/BA44, BA45, frontal, temporal folders of per-participant fMRI laterality-index csv files (overt/covert reading, auditory naming, picture naming tasks) for PWS and controls, with scan-details table (Watkins lab). NeuroVault collection 16872 'Language Laterality in Stuttering' (8 group T maps, PWS vs TFS for the same four tasks, owner Birtan_Demirel) is the image deposit of the same study."
  - key: S7
    title: "Differences in dynamic motor selection in stuttering"
    year: 2026
    ids: ["10.17605/OSF.IO/GP84X", "osf.io/gp84x"]
    archives: [OSF]
    evidence: "OSF files: data/meg/epos/sub_7xxM(C|P)A/ folders of Glasser-parcellated MEG epoch .fif files (~70 MB each) plus OASES, PAiS and SSI-4 tables and MEG analysis notebooks; PWS vs controls."
  - key: S8
    title: "Speech Timing Deficit of Stuttering: Evidence from Contingent Negative Variations"
    year: 2017
    ids: ["figshare:4532570", "10.1371/journal.pone.0168836.s001", "10.1371/journal.pone.0168836.s002", "10.1371/journal.pone.0168836.s003"]
    archives: [Figshare]
    evidence: "confidence: borderline (journal supporting-information files, not a stand-alone deposit). Figshare item 4532570 (PLOS ONE SI) holds S1-S3 File.xls with per-participant ERP amplitudes (N1/N2/P2/P3, CNV C400-C700 at F3..P4) labelled AWS/AFS; 15 AWS, 15 fluent adults."
  - key: S9
    title: "An fMRI study of initiation and inhibition of manual and spoken responses in people who stutter"
    year: 2020
    ids: ["neurovault:collection:8669", "https://neurovault.org/collections/8669/"]
    archives: [NeuroVault]
    evidence: "NeuroVault API: 16 group fMRI-BOLD Z maps (go, successful/unsuccessful stop, stop>go) for PWS (n=33 manual/27 speech) and controls; cited as the MRI data deposit in Wiltshire et al. (PMC12330837). The OSF sibling 10.17605/OSF.IO/ZJSWA holds behaviour only."
  - key: S10
    title: "Neural changes after training with transcranial direct current stimulation to increase speech fluency in adults who stutter"
    year: 2022
    ids: ["neurovault:collection:12207", "https://neurovault.org/collections/12207/"]
    archives: [NeuroVault]
    evidence: "NeuroVault API: 4 group fMRI-BOLD T maps (PWS speech vs rest n=25, PWS vs PWNS n=40, PWNS, change PWS-active vs sham tDCS) (Chesters et al.; follow-up of Brain 10.1093/brain/awy011). OSF q9f8n has only the paper PDFs."
  - key: S11
    title: "Differences in brain activity during sentence repetition in people who stutter"
    year: 2025
    ids: ["neurovault:collection:21188", "https://neurovault.org/collections/21188/"]
    archives: [NeuroVault]
    evidence: "NeuroVault API: 2 FSL zstat images described as average brain activity for groups of people who stutter and typically fluent speakers during sentence repetition (owner Birtan_Demirel); named as the data deposit (group averages in standard space) of the preprint PPR1047095 pooling fMRI from four studies (56 PWS, 53 controls)."
  - key: S12
    title: "RIC (data for 'Reactive Inhibitory Control Precedes Overt Stuttering Events')"
    year: 2024
    ids: ["osf.io/97tsm", "97tsm"]
    archives: [OSF]
    evidence: "OSF files: epochs_TF/R16xx_all-epo.fif per-participant MEG epochs (0.4-0.7 GB each, 29 files), fsaverage inverse operators, behaviour and stuttering-severity xlsx, PSD/TF scripts; named as data deposit of Neurobiology of Language 2024 MEG study of 29 stutterers (PMC11192511)."
  - key: S13
    title: "CS-GIMME data (The Speech Network in Childhood Stuttering: functional connectivity of planning and motor circuits)"
    year: 2025
    ids: ["osf.io/uv263", "uv263"]
    archives: [OSF]
    evidence: "OSF files: demographics xlsx plus RS_extraction_individual_subjects/*.txt (149 entries) of per-child preprocessed resting-state fMRI time series from 12 speech-network ROIs; data statement of PMC12978680 (73 CWS, 74 CNS, rsfMRI)."
  - key: S14
    title: "Differences in multi-parameter maps in adults who stutter"
    year: 2021
    ids: ["neurovault:collection:9572", "https://neurovault.org/collections/UPUDTUZJ/", "UPUDTUZJ"]
    archives: [NeuroVault]
    evidence: "NeuroVault API (unlisted private-link collection UPUDTUZJ = id 9572, owner gabriel.j.cler): 12 structural-MRI TFCE group-difference maps (MT, R1, R2* in grey and white matter, PWS vs controls, n=73); cited as the data in Cler et al. 2021 'Elevated iron concentration in putamen ... developmental stuttering' (PMC8634076)."
  - key: S15
    title: "PAC data analysis-NBL (ERPAC in quiet vs informational-masking speech planning, adults who stutter vs controls)"
    year: 2026
    ids: ["10.5281/zenodo.21906356", "10.5281/zenodo.21906355"]
    archives: [Zenodo]
    evidence: "Zenodo record 21906356 (concept 21906355, Saltuklaroglu): README says Data/ holds per-subject ERPAC .npy arrays and trial-averaged mu waveforms from IC-weighted EEG (left/right sensorimotor mu) for AWS and controls; Data zip 47 MB plus Alldata6b.xlsx and PAConlylong.xlsx; raw single-trial EEG not included."
