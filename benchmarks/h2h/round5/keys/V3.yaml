queries:
  - "OpenNeuro GraphQL advancedSearch keywords: stutter 26 (fuzzy, 3 returned), stuttering 0, stutterers 1, disfluency 0, fluency 20. Full catalogue via datasets() paging: 1912 datasets, Name+README regex stutter|stammer|disfluen|cluttering -> 2 (ds003469, ds007394; both near misses)."
  - "DataCite (titles/descriptions/subjects stutter* OR stammer*): 4299 records, paged and regex-filtered for stutter/stammer + imaging terms -> 707, non-text types screened by hand. Free-text 'stuttering OR stutterers OR \"who stutter\" OR stammering ...': 1792 (0 new). Non-English: 口吃 698, 吃音 484, Stottern 127, bégaiement 94, заикание 62, tartamudez 41, gagueira 13, kekemelik 5, balbuzie 2, jąkanie 1, stotteren 1 (dataset-type hits screened). Creator searches (Dataset/Collection/Image/Other) for 38 stuttering-neuroimaging authors (Bowers 2, Saltuklaroglu 4, Jenson 5, Neef 26, Watkins 22, Busan 6, Cler 4, Maxfield 7, Guenther 27, etc.)."
  - "Zenodo /api/records (25/page, fully paged): 'stuttering OR stutter OR stutterers OR stammering OR \"who stutter\"' 360; creators.name: Saltuklaroglu 2, Bowers 0, Jenson 30, Busan 1, Neef 135, Gastaldon 1, Chesters 94, Daliri 19, Toyomura 0, Sowman 1, Jackson 1, Usler 3, Cler 3, Kell 117, Korzeczek 5, Demirel 321 (titles screened)."
  - "Figshare POST /v2/articles/search: ':title: stuttering' 281 (field prefixes ignored; same 281 for stutter/stutterers), ':title: stammering' 18, ':description: stammering' 36, ':description: \"who stutter\"' 173; 'stuttering EEG' 4, 'stuttering MRI' 13, 'stuttering ERP' 2, 'stuttering fNIRS' 0, 'stuttering brain' 76, 'stuttering MEG' 1, 'stuttering diffusion' 3, 'stuttering event-related potentials' 4, 'stutter neural' 32, 'who stutter fMRI' 2; 20 candidate items' file lists fetched; resource_doi 10.1371/journal.pone.0333205 8."
  - "OSF API v2 nodes filter[title][icontains]=stutter 64, =stammer 7; filter[description][icontains]=stutter 49, =stammer 4 (88 unique, all screened); filter[tags]: stuttering 18, stammering 3, 'developmental stuttering' 2, 'adults who stutter' 1, fluency 32, disfluency 11, others 0. Recursive file listings fetched for 25 projects; 4 registrations checked (no files)."
  - "NeuroVault /api/collections (all 18005 collections paged with curl): regex stutter|stammer|disfluen in name/description/authors -> 42 collections; image lists fetched for all 42; plus unlisted private-link collection UPUDTUZJ found via PMC8634076."
  - "Dryad /api/v2/search: stuttering 4, stutter 4, stammering 1, 'who stutter' 0 (none relevant). Harvard Dataverse search (federated): stuttering 8, stutter 9, stammering 4 (none relevant); Dataverse API for GRO.data doi:10.25625/OQBVSL and Harvard doi:10.7910/DVN/UGZ1IG. DANDI search stutter/stuttering/stammer 0. Kaggle /api/v1/datasets/list: stuttering 7, stutter 13, stammering 3, 'stuttering eeg'/'mri'/'brain'/'fmri' 0 (all speech audio). PhysioNet published projects 739, regex 0 relevant. NITRC group search stuttering/stutter 0. EBRAINS KG search 0. Mendeley Data public search API ignored the query (Mendeley covered via DataCite 10.17632). GIN search API timed out twice and ScienceDB query API did not filter, so neither was searched."
  - "Europe PMC: '(stutter* OR stammer*) AND (MRI OR fMRI OR EEG OR MEG OR NIRS ... )' 4674; same AND repository/data-availability terms 1393; title/abstract stuttering AND imaging terms 1028, of which HAS_FT:Y 596 (591 PMCIDs); fullTextXML fetched 591, 315 returned XML (277 HTTP 500, non-OA) and were regex-scanned for repository ids and data-availability sections. Repository-name queries with (stutter* OR stammer*): neurovault 8, openneuro 5, osf.io 376, zenodo 224, figshare 124, 'mendeley data' 15, dryad 293, dataverse 20, gin.g-node 0, nda.nih.gov 4, fcon_1000 2, INDI 679, kaggle 9, ebrains 2, OpenfMRI 0, scidb 0, physionet 11; union of osf/neurovault/zenodo/figshare/mendeley 734 (105 stuttering-titled, incl. preprints PPR1047095, PPR828140 whose full texts were read)."
size_verdict: "ok: 15 distinct studies, 14 firm + 1 borderline, across 6 archives (OSF 6 [S4, S5, S6, S7, S12, S13; S6 is also in NeuroVault], NeuroVault 5 [S6, S9, S10, S11, S14], Zenodo 2, Mendeley Data 1, GRO.data 1, Figshare 1 borderline). This is within 5-30 firm with at least 3 archives, so the backup topic was not used."
