task: V5
prompt: >-
  Find every public dataset, in any archive, of mass-spectrometry or NMR metabolite profiling of honey (metabolomics,
  lipidomics, or volatile, phenolic or other multi-compound chemical fingerprinting) from any bee species, including
  stingless bees. Raw or processed data both count, as do deposits that include honey alongside other sample types.
  Data on bee tissues, pollen, propolis, nectar or mead alone, on animals fed honey, residue- or contaminant-only
  assays (pesticides, PAHs, toxins), proteomics, DNA- or pollen-based origin tests, physicochemical, sensor or optical
  spectroscopy (FTIR, NIR, Raman, GC-IMS) data, journal supplementary files, and papers without a data deposit do not
  count.
criteria: >-
  Topic: BACKUP (MS or NMR metabolomics / lipidomics of honey). The primary topic (MS/NMR metabolomics or lipidomics of
  human breast milk) was abandoned because it exceeded the 30-firm ceiling (see size_verdict and
  scratch/primary_tally.md). Included: a public deposit holding LC-MS, GC-MS, direct-infusion MS or 1H NMR data (raw
  files, peak tables, compound-identification reports or quantified-metabolite tables) acquired on honey samples from
  Apis or stingless bees, in an untargeted design or as a multi-compound panel (phenolics, flavonoids, volatiles, NMR
  quantification of tens of constituents). Headspace/SPME GC-MS volatile profiling counts. Deposits that mix honey
  with other matrices (nectar, colony materials, food from the Hadza environment) count when honey files are present.
  Author-deposited compound reports in PDF count when the deposit text names the MS technique. Borderline: deposits
  whose files could not be read and whose deposit text does not name the analytical technique, and author-deposited
  supplementary PDFs. Excluded: honey bee or animal tissues (including mice fed honey), pollen, propolis, nectar or mead
  without honey; residue and contaminant assays (pesticides, PAHs, fipronil, neonicotinoids, alkaloid toxins,
  polymer additives), including suspect screening against a pesticide inclusion list; single-compound studies
  (p-coumaric acid, lindoside structure); proteomics; DNA, qPCR or pollen origin tests; physicochemical, mineral,
  antioxidant or sensory data; FTIR, NIR, Raman, hyperspectral, fluorescence, microwave-sensor and GC-IMS (ion
  mobility, not MS) data; HPLC chromatograms without a stated MS or NMR detector; publisher supplementary-material
  items mirrored on Figshare (PLOS tables, Frontiers data sheets, Taylor & Francis, SciELO, Royal Society and Springer
  Nature supplements) and article PDFs or accepted manuscripts deposited in Zenodo or institutional repositories;
  restricted or deleted records. Unit = study. MW study IDs, project IDs and project DOIs, MetaboLights studies and
  their Zenodo raw-data mirrors, MassIVE accessions and their DOIs, re-uploads of the same files under new MassIVE
  accessions or new Zenodo concept records, Dryad deposits and their Zenodo code/supplement mirrors, Mendeley versions,
  and per-sample companion Mendeley deposits of one paper are aliases. Separate deposits from different papers are
  separate studies, even from the same lab.
