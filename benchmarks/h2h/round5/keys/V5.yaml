size_verdict: "switched to BACKUP. The primary topic (MS/NMR metabolomics or lipidomics of human breast milk) had about 33-36 likely-firm studies before generalist repositories were fully screened (5 MW, 9 MetaboLights, about 14 MassIVE/GNPS and 5-8 Mendeley/Zenodo/SciDB/Recherche Data Gouv/SciELO; scratch/primary_tally.md), above the 30-firm ceiling. Backup (honey): 25 studies after alias grouping (24 firm, 1 borderline) in 8 archives: Metabolomics Workbench 4, MetaboLights 1 (shared with Zenodo), MassIVE 7, Dryad 1 (with Zenodo mirrors), Mendeley Data 6, Zenodo 2 own (S20, S25) plus 2 mirrors, Figshare 3, Science Data Bank 1. This is within the 5-30 firm gate across at least 3 archives."
