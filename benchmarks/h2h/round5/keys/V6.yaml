task: V6
prompt: >-
  Find every public dataset, in any archive, that holds methanesulfonic acid (MSA, methanesulfonate) measurements
  from ice cores or firn cores drilled in the Northern Hemisphere (Greenland ice sheet and ice caps, the Canadian,
  Alaskan and Eurasian Arctic, and Northern Hemisphere mountain glaciers). Datasets of multi-species ice-core chemistry
  count if they include an MSA column. Snow-pit or surface-snow sampling, atmospheric aerosol MSA, Antarctic and other
  Southern Hemisphere cores, records that only use MSA to date layers without reporting it, and papers without
  deposited data do not count.
criteria: >-
  Topic: BACKUP (ice-core records of MSA), narrowed to the Northern Hemisphere because both the primary and the
  full backup topic exceeded the 30-study size gate (see size_verdict). Included: a public archive deposit (NOAA NCEI
  Paleoclimatology, PANGAEA, NSF Arctic Data Center, or any other repository) whose data files or parameter list hold
  MSA/methanesulfonate concentrations (or fluxes) measured on an ice core or firn core drilled north of the equator.
  Multi-species chemistry tables count if MSA is a reported column, confirmed from the NOAA variable list or file
  header, the PANGAEA parameter list, or the Arctic Data Center EML attribute list or file header. Unit = study: the
  same data deposited in NOAA and PANGAEA (GISP2 MSA, GRIP ions), old and new DOIs of the same Arctic Data Center
  package, and several per-core packages from one project and one PI submission (West Greenland Disko/Nuussuaq/ice-sheet
  cores) are aliases of one study. Flagged borderline: datasets PANGAEA lists as validated but unpublished (no DOI
  registered), and an MSA column that sits inside a dating file of a firn-density study. Excluded (near misses): snow
  pits and surface snow, atmospheric aerosol MSA, sibling deposits from the same project that lack MSA, records that
  only cite MSA as a dating marker, Antarctic/Southern Hemisphere cores (including Quelccaya, Peru, 13.9 S), and
  deposits whose MSA content could not be confirmed.
studies:
