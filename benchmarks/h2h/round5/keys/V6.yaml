size_verdict: >-
  switched and narrowed: the PRIMARY topic (ice-core black carbon) already had at least 32 distinct firm studies before
  Zenodo/Figshare were searched (NOAA 8, Arctic Data Center 13, USAP-DC 4, PANGAEA at least 7 more distinct), so it
  fails the 5-30 gate. The BACKUP topic in full (all ice-core MSA) also exceeded it, with about 41 firm studies (NOAA 10,
  PANGAEA 12, Arctic Data Center 7, USAP-DC 3, AADC 1, UK Polar Data Centre 5 or more, Zenodo 3). The brief has no rule
  for a backup that also fails, so the backup prompt was narrowed to Northern Hemisphere ice and firn cores, with the
  Southern Hemisphere records kept as near misses. Result: 15 studies (13 firm, 2 borderline) across 3 archives (NOAA
  NCEI 4, two of them also in PANGAEA; PANGAEA 5 including the 2 NOAA aliases, 3 PANGAEA-only; NSF Arctic Data Center
  8). This is within 5-30 with at least 3 archives.
