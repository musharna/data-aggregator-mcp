    evidence: "NOAA study 26691 holds raw MSA files for D4 and NGT-B16/B18/B20/B21/B26 (osman2019*msa.txt, variable methanesulfonate) behind Osman et al. 2019 Nature 10.1038/s41586-019-1181-8; DOI resolves."
