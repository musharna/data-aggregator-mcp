    title: "GISP2 Ice Core 11,000 Year Methanesulfonic Acid (MSA) Data"
    year: 1997
    ids: ["10.25921/50sv-7k61", "noaa-icecore-17804", "https://www.ncei.noaa.gov/access/paleo-search/study/17804", "10.1594/PANGAEA.56095", "10.1594/PANGAEA.56096"]
    archives: [NOAA NCEI, PANGAEA]
    evidence: "NOAA study 17804 files msacored.txt/msacoref.txt hold MSA (ion chromatography) in GISP2 D and F cores (Saltzman et al. 1997 JGR 10.1029/97JC01377), and PANGAEA 56095/56096 are the same D- and F-core MSA tables from the GISP2/GRIP CD-ROM (parameter 'Methanesulfonic acid'); all DOIs resolve."
