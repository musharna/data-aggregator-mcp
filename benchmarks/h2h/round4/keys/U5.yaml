  - "DataCite client.uid:cos.osf AND eye terms: 4433 (regex screen 147 hits, then manual review); prefix 10.23668 (PsychArchives) AND eye terms 125; prefix 10.17910 AND eye AND reading 0; prefix 10.17632 (Mendeley) 80; 'developmental reading' 1; 'Chinese children' 14; Finnish 2; German/Kinder 10; adolescents/secondary Dataset 3; dyslexia overlay 4; prefix 10.6075 (Rayner collection) 17; Jakovljevic creators 953 (all noise)."
