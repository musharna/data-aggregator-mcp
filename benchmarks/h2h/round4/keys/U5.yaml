task: U5
prompt: >-
  Find every public dataset, in any archive, that holds eye-tracking recordings of children or adolescents (under 18)
  reading text (sentences or passages, in any language): raw gaze samples, fixations and saccades, or per-word or
  per-region reading measures derived from them. Corpora that include child readers alongside adults count; adult-only
  samples, non-reading eye-tracking tasks, single-word naming without eye tracking, and papers without deposited data do
  not count.
criteria: >-
  Topic: PRIMARY (eye tracking of under-18 readers reading sentences or passages). Included: a public deposit holding
  eye-movement data (raw samples, fixation/saccade reports, interest-area or word-level measures, or trial-level
  eye-movement measures) recorded while children or adolescents (any age under 18, typically developing or with
  dyslexia, deafness etc.) read connected text, in any language and any archive. Mixed child + adult corpora count.
  Participant age, task and data contents were confirmed from the deposit metadata and file listing or, if the deposit
  is silent, from the linked paper (Europe PMC full text). Flagged confidence: borderline: (after the 2026-10-18 OSF
  re-check, see revised) deposits holding only subject-level summaries of eye
  measures; reading of subtitles or maths word problems; deposits whose host could not be reached; data held only on
  GitHub. Excluded: adult-only samples (including dyslexic adults and university students); non-reading tasks
  (free viewing, visual search, map reading, video games, RAN, op-art); finger tracking; records whose files are
  embargoed, restricted or login/subscription-only; code-only, stimuli-only, figure-only and paper/PDF-only records;
  data-on-request papers; DOIs that do not resolve. Unit = study: concept/version DOIs, collection and item DOIs,
  journal-supplement DOIs, handles and component GUIDs of one project are aliases of one study; deposits from different
  papers are separate studies.
