task: U1
prompt: >-
  Find every public dataset, in any archive, that holds human intracranial recordings (ECoG, stereo-EEG, depth
  electrodes, or microwire/microelectrode single units and LFP) made during natural sleep, overnight or during naps,
  where sleep is staged or at least sleep periods are identified. Raw or processed neural data both count. Scalp-only
  EEG or polysomnography, animal recordings, wake-only task recordings, recordings under anesthesia only, code-only
  repositories, and papers without deposited data do not count.
criteria: >-
  Topic: PRIMARY (human intracranial recordings during natural sleep). Included: a public, openly downloadable deposit
  (OpenNeuro, NEMAR, CRCNS, DANDI, SPARC/Pennsieve, Zenodo, Figshare, Dryad, OSF, Deep Blue Data, CORA/CSUC Dataverse,
  etc.) holding intracranial neural data from human patients (subdural ECoG, SEEG/depth electrodes, laminar or Utah
  microelectrodes, microwire units) recorded during natural sleep. The deposit or its paper must stage the sleep or mark
  sleep periods (files, tasks or sessions named for sleep, NREM/SWS clips, hypnograms, or sleep labels). Processed data
  count, such as per-subject ripple, MUA or coherence results and per-figure source data derived from the sleep
  recordings. Borderline: sleep identified only by coarse video labels; deposits where only a minority of patients are
  intracranial; continuous multi-day recordings whose deposit lacks sleep labels although the paper staged sleep;
  per-night derived time series; and records whose files could not be listed (OSF was offline for scheduled
  maintenance throughout this build, 2026-10-16 to 2026-10-19). Excluded: scalp-only EEG, hd-EEG or EEG-fMRI sleep data;
  animal (rodent, cat, canine, macaque) recordings; wake-only task or resting recordings; intraoperative recordings
  under general anesthesia only; seizure-only clips; embargoed, controlled-access, restricted or login-only records,
  and DOIs whose data are not public; code-only software releases; and papers, posters or supplements. Unit = study.
  OpenNeuro snapshots and their NEMAR mirrors (10.82901/nemar.onXXXXXX), Dryad deposits and their Zenodo mirrors,
  concept and version DOIs, multi-part uploads of one dataset, and NEMAR re-packagings of another archive's deposit are
  aliases. Separate deposits from different papers are separate studies, even from the same lab or cohort.
studies:
  - key: S1
    title: "High frequency oscillations detected in the intracranial EEG of epilepsy patients during interictal sleep, patients' electrode location and outcome of epilepsy surgery (Zurich iEEG HFO dataset)"
    year: 2017
    ids: ["10.6080/K06Q1VD5", "crcns:ieeg-1", "OpenNeuro:ds003498", "10.18112/openneuro.ds003498.v1.1.1", "10.18112/openneuro.ds003498.v1.0.1", "10.82901/nemar.on003498"]
    archives: [CRCNS, OpenNeuro, NEMAR]
    evidence: "CRCNS about page: subdural and depth iEEG from 20 patients, up to six 5-min intervals of interictal slow-wave sleep per night recording, with HFO markings (Fedele et al. 2017 Sci Rep). OpenNeuro ds003498 (sessions ses-interictalsleep) is the BIDS conversion of the same data and says so in its README; NEMAR on003498 mirrors it."
  - key: S2
    title: "Epilepsy-iEEG-Interictal-Multicenter-Dataset"
    year: 2021
    ids: ["OpenNeuro:ds003876", "10.18112/openneuro.ds003876.v1.0.2", "10.82901/nemar.on003876"]
    archives: [OpenNeuro, NEMAR]
    evidence: "README: interictal iEEG (NIH, JHH, UMF; Bernabei & Li et al.) 'possibly with sleep or awake state annotated'; S3 listing has 60 task-interictalasleep files beside 55 task-interictalawake files."
  - key: S3
    title: "Dataset Clinical Epilepsy iEEG to BIDS - RESPect_longterm_iEEG"
    year: 2021
