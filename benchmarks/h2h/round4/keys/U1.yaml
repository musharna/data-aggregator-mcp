size_verdict: >-
  ok: 31 distinct studies, 25 firm and 6 borderline. The 25 firm studies span 11 archives: Zenodo 12, NEMAR 12, OpenNeuro 6, Dryad 2, CRCNS 1, Figshare 1, SPARC 1, OSF 1, Deep Blue Data 1, CORA/CSUC Dataverse 1, MNI Open iEEG Atlas 1 (studies with aliases count once per archive). This is within the 5-30 firm gate across at least 3 archives, so the primary topic stands and the backup (anesthesia) topic was not used. Not checked: OSF file listings (API offline for maintenance 2026-10-16 to 10-19), the Deep Blue Data and CSUC landing pages (bot challenges; their DataCite records were used instead), the MNI Open iEEG Atlas portal (login), ieeg.org (not searched), and about 100 Europe PMC papers without full text.
