    archives: [OpenNeuro, NEMAR]
    evidence: "UMC Utrecht long-term ECoG/SEEG (6 patients); README defines task 'sleep' as a file where the patient sleeps most of the time; snapshot tasks include task-sleep/task-Sleep (70 files) and task-slawtrans (sleep-wake transition)."
