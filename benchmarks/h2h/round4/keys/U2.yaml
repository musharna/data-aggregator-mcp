size_verdict: >-
  backup used. The primary topic (DFTD sequencing) exceeds the 30-study ceiling: titles and descriptions of the 66
  S. harrisii BioProjects alone gave about 30 distinct DFTD studies (tumour and cell-line genomes, transcriptomes,
  methylomes, amplicon and RAD/capture population genomics of resistance, MHC/TCR typing; e.g. PRJEB21902, PRJEB51704,
  PRJEB40407, PRJNA613730, PRJNA306495, PRJNA450403, PRJEB8782, PRJNA422612, PRJEB28680, PRJNA531105) before GEO, Dryad,
  Figshare, Zenodo and the 268 DataCite DFTD records were screened. Backup topic B. salamandrivorans: 14 distinct studies
  (13 firm, 1 borderline), within the 5-30 range, across 7 archives counted by native host (NCBI SRA/BioProject 14,
  NCBI Assembly 3, GEO 1, NCBI TSA 2, Dryad 2, Figshare 1) with ENA and DDBJ mirroring every NCBI record and NGDC
  mirroring most. No Bsal sequencing deposit exists natively in ENA, DDBJ, NGDC GSA, EGA or Zenodo (checked: those
  archives' own APIs, see queries).
