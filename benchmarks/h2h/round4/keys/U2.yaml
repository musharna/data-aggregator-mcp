task: U2
prompt: >-
  Find every public dataset, in any archive, of high-throughput sequencing data from the salamander chytrid fungus
  Batrachochytrium salamandrivorans (Bsal): genome or transcriptome sequencing of Bsal isolates, or sequencing (for
  example host RNA-seq or skin-microbiome amplicons) of amphibians experimentally or naturally infected with or exposed to
  Bsal. Raw reads, assemblies and processed sequence tables all count. Sanger single-gene sequences, qPCR or other
  non-sequencing detection data, sequencing of animals or environments never exposed to Bsal, B. dendrobatidis-only data,
  and papers without deposited data do not count.
criteria: >-
  Topic: BACKUP (the primary topic, Tasmanian devil facial tumour disease sequencing, failed the size gate; see
  size_verdict). Included: a public deposit holding high-throughput sequencing data (Illumina, PacBio, Nanopore, RNA-seq,
  WGS, 16S amplicon) or products derived from it (genome assemblies, TSA transcriptome assemblies, ASV/OTU tables) that
  either sequence Bsal itself (cultured isolates, zoospores) or sequence hosts that were infected with or exposed to Bsal
  in an experiment or in a confirmed outbreak, sampled after exposure. Bsal exposure was taken from the deposit metadata
  (titles, descriptions, BioSample treatment or disease fields) or, when the deposit is silent, from the linked paper's
  full text. Deposits that mix Bsal-exposed hosts with Bd-exposed or control hosts count. A soil microcosm inoculated with
  Bsal (bacterial 16S, no amphibian host) is kept as confidence: borderline. Excluded: qPCR, ddPCR, eDNA-qPCR and
  prevalence tables; Sanger amplicon confirmation; phenotype, growth, survival and niche-model data without sequencing;
  skin-microbiome or host sequencing of animals not exposed to Bsal (wild surveys where Bsal was absent or untested,
  in-vitro mucosome assays, microbiomes sampled before exposure); Bd-only sequencing, including Bd genotyping panels that
  carry one Bsal locus; journal supplements and code-only deposits that do not hold sequence data; umbrella BioProjects
  with no data of their own. Unit = study (one paper or, for unpublished deposits, one BioProject). BioProject, SRA study,
  GEO series, assembly and TSA accessions of one paper, and a Dryad or Figshare deposit holding that paper's processed
  sequence tables, are aliases; separate deposits from different papers are separate studies.
