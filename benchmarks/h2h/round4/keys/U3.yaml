task: U3
prompt: >-
  Find every public dataset, in any archive, that holds mass-spectrometry proteomics data (including phosphoproteomics,
  acetylomes and other PTM proteomics) from rice plants (Oryza sativa or other Oryza species) exposed to drought or water
  deficit: soil drying, withholding water, reduced field capacity, or PEG-simulated drought. Raw or processed MS data
  both count. Salt-, cold-, heat- or ABA-only treatments, other species, transcriptome-only or metabolome-only data, gel
  images without MS data, and papers without deposited data do not count.
criteria: >-
  Topic: PRIMARY (rice drought MS proteomics). Included: a public deposit in any archive (ProteomeXchange members PRIDE,
  iProX, jPOST, MassIVE, PeptideAtlas, Panorama; NGDC OMIX; Zenodo; Figshare; etc.) holding MS proteomics or PTM-proteomics
  data (raw files, search results, or processed protein/peptide quantification tables) from Oryza plants where at least
  one sampled group was drought-stressed. That covers soil drying, withheld water, reduced field capacity or soil water
  potential, dehydration by withholding water, and PEG-6000 osmotic stress. Drought-stressed IP-MS or PTM-enrichment
  samples count. Treatment and species were confirmed from the deposit's own record (PROXI/PRIDE sample protocol, iProX,
  OMIX or Zenodo metadata, file names) or, if silent, from the linked paper (Europe PMC full text). Flagged
  confidence: borderline: combined drought+salt+temperature stress applied together; publisher supplement tables on a
  journal Figshare portal (ACS, Springer Nature/BMC, Taylor & Francis) that list MS-identified/quantified proteins but no
  raw data; a supplement whose osmotic-stress agent is not stated in the deposit. Excluded: unreleased/private
  accessions (even when printed in a paper); salt-, cold-, heat-, ABA- or pathogen-only rice proteomics; interactome or
  in-vitro assays done on unstressed material, even in drought-themed papers; reanalysis-only datasets whose inputs
  include no drought samples; other species (tef, wheat, sorghum, maize, Streptomyces) even when rice proteins were in the
  search database; metabolomics-only and transcriptomics-only deposits; theses, paper records and primer/figure-only
  supplements. Unit = study: a PXD and its iProX IPX project, its 10.6019 DOI, and publisher supplement items of the same
  paper are aliases; two or more PXDs (or OMIX entries) that share one paper are grouped as one study. Separate deposits
  with no shared paper stay separate studies even when they come from the same lab.
