size_verdict: "ok: 24 distinct studies (19 firm, 5 borderline) across 5 archives (studies per archive: PRIDE 15 [14 firm + 1 borderline], iProX 3, Zenodo 1, NGDC OMIX 1, Figshare 5 [4 borderline publisher-supplement studies + the S17 alias tables]). The firm count (19 across PRIDE, iProX, Zenodo and OMIX) is within the 5-30 range with at least 3 archives, so the backup wheat topic was not used."
