task: U4
prompt: >-
  Find every public dataset, in any archive, that holds field measurements of microplastics (particle counts or
  concentrations, polymer types, sizes or shapes) in snow, sea ice, glacier ice or ice cores collected in the Arctic,
  in Antarctica, or on high-mountain glaciers (Alps, Himalaya/Tibetan Plateau, Andes and similar). Compilations that
  include such measurements count. Seawater-only, sediment-only, biota-only and air or deposition-collector samples,
  laboratory experiments, model output, and papers without deposited data do not count.
criteria: >-
  Topic: PRIMARY (microplastics in polar or high-mountain-glacier snow and ice). Included: a public deposit with
  downloadable measurements (counts, concentrations, polymer, size or shape) of plastic particles in field samples of
  snow, firn, sea ice, glacier ice or ice cores from the Arctic (including Svalbard, Greenland, the Canadian Arctic and
  the central Arctic Ocean), from Antarctica or the Southern Ocean pack ice, or from high-mountain glaciers and their
  snow cover (Alps, Himalaya, Tibetan Plateau, Andes, Cascades volcano glaciers). A deposit that mixes such samples with
  seawater, sediment or other matrices counts if the snow or ice data are in the files. Flagged confidence: borderline
  (kept in studies): deposits that quantify only NANOplastics (by TD-PTR-MS mass, not particle counts); supraglacial
  debris (sediment lying on the glacier surface, not ice or snow); a multi-site mountain-snow deposit where only some
  sites are glacier snow; a compilation whose files sit behind a registration-based download; and a journal-supplement
  xlsx hosted on Figshare. Excluded (near misses): seawater, sediment, sediment-trap, biota, guano or air and
  deposition-collector datasets; seasonal snow away from glaciers in mid-latitude mountains or cities (Sierra Nevada,
  Utah, Türkiye, Hokkaido, Siberia); sea ice outside the Arctic and Antarctic (Okhotsk, Baltic, Sea of Japan, Bohai);
  laboratory freezing or snow-darkening experiments; model output; code-only deposits; metadata-only project records
  whose data must be requested (Canadian Polar Data Catalogue / CCIN Northern Contaminants Program records, Antarctica
  NZ catalogue record); conference abstracts, article copies and supplement PDF/DOCX files; data cited in a
  microplastics paper that are not microplastic data. Unit = study: versions, concept and version DOIs, and Mendeley
  version DOIs are aliases of one study.
studies:
  - key: S1
    title: "Microplastic and environmental data from Arctic sea ice"
    year: 2018
    ids: ["10.1594/PANGAEA.886593", "PANGAEA.886593"]
    archives: [PANGAEA]
    evidence: "PANGAEA ES + DataCite: sea-ice cores from the Arctic Ocean / Fram Strait (Polarstern) with microplastic concentrations, polymer types and sizes by FTIR (Peeken et al. 2018 Nat Commun 10.1038/s41467-018-03825-5, whose data statement points only to this DOI)."
  - key: S2
    title: "Microplastic in snow from European and Arctic sites"
    year: 2019
    ids: ["10.1594/PANGAEA.901447", "PANGAEA.901447"]
    archives: [PANGAEA]
    evidence: "PANGAEA: snow samples from Svalbard and Fram Strait ice floes plus Alpine and other European sites, microplastic counts and polymers by FTIR imaging (Bergmann et al. 2019 Sci Adv 10.1126/sciadv.aax1157); qualifies through the Arctic and Alpine (Davos/Tschuggen) samples."
  - key: S3
    title: "Southern Ocean Sea Ice Microplastic Analysis - PanAntarctic study 2004-2022"
    year: 2024
    ids: ["10.26179/qzf5-tr20", "AADC:PanAnt_MPs"]
    archives: [Australian Antarctic Data Centre]
    evidence: "AADC records API: 19 sea-ice cores from 10 expeditions (Weddell, Ross, Bellingshausen Seas, East Antarctica), FTIR microplastic concentration and polymer data, 1.02 MB Excel at data.aad.gov.au/eds/5992/download, CC-BY (Kelly et al. 2024 Water Emerg Contam 10.20517/wecn.2024.66)."
  - key: S4
    title: "Microplastics in sea ice methodology cores"
    year: 2024
    ids: ["10.25959/bn9r-2f27", "IMAS:58fdf02b-5009-4f11-ba1f-71de23fd74ef"]
    archives: [IMAS Data Portal]
    evidence: "IMAS GeoNetwork ISO record: five subsections of East Antarctic sea-ice cores analysed for microplastics; attachment MPs_in_sea_ice_methodology_5_cores.xlsx returns HTTP 200 (Kelly et al. 2025 Polar Biol 10.1007/s00300-025-03399-1, reporting 4-116 particles per litre and 14 polymers)."
  - key: S5
    title: "Microplastic abundance in Antarctic Snow samples"
    year: 2025
    ids: ["10.5285/ac6ade29-2815-4938-a93a-d84f0d322bd6", "GB/NERC/BAS/PDC/01975"]
    archives: [UK Polar Data Centre]
    evidence: "DataCite + BAS full record: microplastic concentrations (73-3099 MP per litre), sizes down to 11 um and polymers in snow from Union Glacier, Schanz Glacier and the South Pole, data on the BAS Ramadda server (Jones-Williams et al. 2025 Sci Total Environ 10.1016/j.scitotenv.2025.178543)."
  - key: S6
    title: "Microplastics and nanoplastics counts for an Antarcic transect (Dec 2023 - Jan 2024)"
    year: 2026
    ids: ["10.15784/602048", "USAP-DC:602048"]
    archives: [USAP-DC]
    evidence: "USAP-DC dataset page: georeferenced snow samples along the Hercules Inlet to South Pole traverse (Spiritus 2024), file AntarcticaSpiritusTraverse2024_Micro-Nano-Plastics.zip (xlsx) with micro- and nanoplastic counts, CC BY 4.0, NSF award 2334490."
  - key: S7
    title: "Microplastics on Mt. Everest (Napper et al., 2020)"
    year: 2020
    ids: ["10.17632/ggk9yhc5vc", "10.17632/ggk9yhc5vc.1"]
    archives: [Mendeley Data]
    evidence: "Mendeley public API: two xlsx files, per-sample MP counts with locations, and per-particle colour, type, length, width and polymer, for Everest snow (Base Camp to the Balcony, 8440 m) and stream samples (Napper et al. 2020 One Earth)."
  - key: S8
    title: "Data for: First evidence of microplastic contamination in the supraglacial debris of an Alpine glacier"
    year: 2019
    ids: ["10.17632/vh7ffvvjt9", "10.17632/vh7ffvvjt9.1"]
    archives: [Mendeley Data]
    evidence: "confidence: borderline (supraglacial debris, not snow or ice). Mendeley public API: Forni microplastic.xlsx, MP abundance in 6 supraglacial debris samples from the Forni Glacier, Italian Alps, 2580 m (Ambrosini et al. 2019 Environ Pollut 10.1016/j.envpol.2019.07.005); DataCite lists the publisher as Bicocca Open Archive Research Data."
  - key: S9
    title: "Replication Data for: Latitudinal patterns of microplastic contamination in remote areas"
    year: 2025
    ids: ["10.13130/rd_unimi/pnvc2i", "doi:10.13130/RD_UNIMI/PNVC2I"]
    archives: [UNIMI Dataverse]
    evidence: "confidence: borderline (supraglacial debris). Dataverse API: MPs_glaciers_polymers_WW.tab and Dataset_WW.tab with MP abundance and polymers in 57 supraglacial debris samples from 9 glaciers, 46 S to 78 N, including Svalbard and Andean glaciers (Crosta et al. 2025 Environ Res 10.1016/j.envres.2025.121553)."
