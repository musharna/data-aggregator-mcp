    archives: [National Tibetan Plateau Data Center]
    evidence: "confidence: borderline (compilation; registration-based download, files not opened). TPDC metadataView/page API: compilation of microplastic abundance, morphology, size and polymers in Arctic rivers, lakes, snow cover, sea ice, seawater and soils (ZHANG Yulan, share policy B, 2 downloads); the DOI resolves to the TPDC record."
  - key: S16
    title: "Micro- and Nanoplastics in Alpine Snow: A New Method for Chemical Identification and (Semi)Quantification in the Nanogram Range (supporting data files)"
    year: 2020
    ids: ["10.1021/acs.est.9b07540.s003", "10.1021/acs.est.9b07540.s004", "10.1021/acs.est.9b07540.s005", "10.6084/m9.figshare.11763645"]
    archives: [Figshare]
