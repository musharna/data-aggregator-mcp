size_verdict: "ok: 16 distinct studies, 7 firm + 9 borderline, across 11 archives (PANGAEA 2; Mendeley Data 2 [1 firm, 1 borderline]; Australian Antarctic Data Centre 1; IMAS 1; UK Polar Data Centre 1; USAP-DC 1; Zenodo 4 borderline; UNIMI Dataverse 1 borderline; Utrecht Yoda 1 borderline; National Tibetan Plateau Data Center 1 borderline; Figshare/ACS 1 borderline). The 7 firm studies span 6 archives, which meets the 5-30 firm studies across at least 3 archives gate, so the backup topic (black carbon on the Tibetan Plateau) was not used."
