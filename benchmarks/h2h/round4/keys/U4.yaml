    archives: [Zenodo]
    evidence: "confidence: borderline (nanoplastics by mass only). Zenodo API: TD-PTR-ToF-MS sample, blank and calibration data (zips of 3-11 GB), blank-corrected analysis and per-polymer fingerprint xlsx for glacier samples collected by mountaineers (Materic et al. 2025 Sci Rep PMC11729883 cites this DOI)."
  - key: S12
    title: "Supplementary data to: Nanoplastic Detection and Quantification in High-Altitude Glacial Snow Samles from Italy, Switzerland and France"
    year: 2026
    ids: ["10.5281/zenodo.17942873", "10.5281/zenodo.17942874", "10.5281/zenodo.19466585", "10.5281/zenodo.21375866", "zenodo:21375866"]
    archives: [Zenodo]
    evidence: "confidence: borderline (nanoplastics by mass only). Zenodo API: HLR2_FinalData.xlsx with fingerprinting results, upscaling and final concentrations, plus processed data and code, for high-altitude glacial snow from the Alps; concept DOI 17942873 is cited in Sci Rep 2026 PMC13457595; DataCite lists the three version DOIs."
  - key: S13
